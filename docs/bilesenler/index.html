<script>
// Nar çalışma zamanı — JavaScript arka ucu.
// Üretilen kodun başına gömülür. Tüm isimler `$` ile başlar; Nar
// tanımlayıcıları `$` içeremediği için çakışma olamaz.

"use strict";

class NarPanic extends Error {
  constructor(message) {
    super(message);
    this.name = "NarPanic";
  }
}

function $panic(message) {
  throw new NarPanic(message);
}

// --- sayılar ---------------------------------------------------------------
function $idiv(a, b) {
  if (b === 0) $panic("sıfıra bölme");
  return Math.trunc(a / b);
}

function $imod(a, b) {
  if (b === 0) $panic("sıfıra bölme (mod)");
  return a % b;
}

// --- opsiyoneller ----------------------------------------------------------
function $unwrap(value, where) {
  if (value === null || value === undefined) {
    $panic("'none' değeri açılmaya çalışıldı" + (where ? " (" + where + ")" : ""));
  }
  return value;
}

// --- Türkçe harf duyarlı dönüşüm -------------------------------------------
// Standart upper()/lower() dil-bağımsızdır: "i" → "I". Türkçe metinde
// doğru sonuç için upperTr()/lowerTr() kullanılır: "i" → "İ", "I" → "ı".
function $upperTr(s) {
  return s.replace(/i/g, "İ").replace(/ı/g, "I").toUpperCase();
}

// --- eşitlik ---------------------------------------------------------------
function $eq(a, b) {
  if (a === b) return true;
  if (a === null || b === null || a === undefined || b === undefined) {
    return (a === null || a === undefined) && (b === null || b === undefined);
  }
  if (typeof a !== "object" || typeof b !== "object") return false;

  if (Array.isArray(a)) {
    if (!Array.isArray(b) || a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) if (!$eq(a[i], b[i])) return false;
    return true;
  }
  if (a instanceof Map) {
    if (!(b instanceof Map) || a.size !== b.size) return false;
    for (const [k, v] of a) {
      if (!b.has(k) || !$eq(v, b.get(k))) return false;
    }
    return true;
  }
  if (a.$tag !== undefined || b.$tag !== undefined) {
    if (a.$tag !== b.$tag) return false;
    return $eq(a.$values, b.$values);
  }
  if (a.constructor !== b.constructor) return false;
  const keys = Object.keys(a);
  if (keys.length !== Object.keys(b).length) return false;
  for (const k of keys) if (!$eq(a[k], b[k])) return false;
  return true;
}

// --- metne çevirme ---------------------------------------------------------
// Tip bilgisi kod üreticiden gelir; JavaScript `4` ile `4.0` arasını
// ayıramadığı için Float'ların doğru yazılması buna bağlıdır.
//
// Tip kodu:  "Int" | "Float" | "Bool" | "String" | <tip adı>
//            ["l", T]  liste   ["m", K, V]  eşleme   ["o", T]  opsiyonel
const $types = Object.create(null);

function $defType(name, def) {
  $types[name] = def;
}

function $strFloat(v) {
  if (v === null || v === undefined) return "none";
  if (!Number.isFinite(v)) return String(v);
  return Number.isInteger(v) ? v.toFixed(1) : String(v);
}

function $fmt(v, t, quoted) {
  if (v === null || v === undefined) return "none";

  if (Array.isArray(t)) {
    if (t[0] === "o") return $fmt(v, t[1], quoted);
    if (t[0] === "u") return $fmtGenerik(v, t[1], t[2], quoted);
    if (t[0] === "l") return "[" + v.map((x) => $fmt(x, t[1], true)).join(", ") + "]";
    if (t[0] === "m") {
      const parts = [];
      for (const [k, val] of v) parts.push($fmt(k, t[1], true) + ": " + $fmt(val, t[2], true));
      return "{" + parts.join(", ") + "}";
    }
  }

  if (t === "Float") return $strFloat(v);
  if (t === "String") return quoted ? JSON.stringify(v) : v;

  if (typeof v === "string") return quoted ? JSON.stringify(v) : v;
  if (typeof v === "number" || typeof v === "boolean") return String(v);
  if (typeof v === "function") return "<fonksiyon>";

  if (Array.isArray(v)) return "[" + v.map((x) => $fmt(x, undefined, true)).join(", ") + "]";
  if (v instanceof Map) {
    const parts = [];
    for (const [k, val] of v) parts.push($fmt(k, undefined, true) + ": " + $fmt(val, undefined, true));
    return "{" + parts.join(", ") + "}";
  }

  // Sayfa öğeleri: `<div id="x" class="y">` biçiminde kısaca gösterilir.
  if (typeof Element !== "undefined" && v instanceof Element) {
    let etiket = v.tagName.toLowerCase();
    if (v.id) etiket += "#" + v.id;
    if (v.className && typeof v.className === "string") {
      etiket += "." + v.className.trim().split(/\s+/).join(".");
    }
    return "<" + etiket + ">";
  }

  const name = v.constructor && v.constructor.$narName;
  const def = name ? $types[name] : undefined;

  if (v.$tag !== undefined) {
    const payload = def && def.variants ? def.variants[v.$tag] : undefined;
    if (!v.$values || v.$values.length === 0) return name + "." + v.$tag;
    const shown = v.$values.map((x, i) => $fmt(x, payload ? payload[i] : undefined, true));
    return name + "." + v.$tag + "(" + shown.join(", ") + ")";
  }

  const keys = Object.keys(v);
  const fieldTypes = def && def.fields ? def.fields : {};
  const shown = keys.map((k) => k + ": " + $fmt(v[k], fieldTypes[k], true));
  return name + " { " + shown.join(", ") + " }";
}

// Uygulanmış generic tip: şablondaki tip parametreleri (T, U…) verilen
// argümanlarla değiştirilerek alan tipleri bulunur.
function $genericEsleme(def, argler) {
  const esleme = Object.create(null);
  const params = (def && def.params) || [];
  for (let i = 0; i < params.length; i++) esleme[params[i]] = argler[i];
  return esleme;
}

function $tipiCoz(tip, esleme) {
  if (typeof tip === "string" && esleme[tip] !== undefined) return esleme[tip];
  if (Array.isArray(tip)) {
    if (tip[0] === "l") return ["l", $tipiCoz(tip[1], esleme)];
    if (tip[0] === "o") return ["o", $tipiCoz(tip[1], esleme)];
    if (tip[0] === "m") return ["m", $tipiCoz(tip[1], esleme), $tipiCoz(tip[2], esleme)];
    if (tip[0] === "u") return ["u", tip[1], tip[2].map((a) => $tipiCoz(a, esleme))];
  }
  return tip;
}

function $fmtGenerik(v, ad, argler, quoted) {
  const def = $types[ad];
  if (!def) return $fmt(v, undefined, quoted);
  const esleme = $genericEsleme(def, argler);

  if (v.$tag !== undefined) {
    const yuk = def.variants ? def.variants[v.$tag] : undefined;
    if (!v.$values || v.$values.length === 0) return ad + "." + v.$tag;
    const shown = v.$values.map((x, i) =>
      $fmt(x, yuk ? $tipiCoz(yuk[i], esleme) : undefined, true));
    return ad + "." + v.$tag + "(" + shown.join(", ") + ")";
  }

  const alanlar = def.fields || {};
  const shown = Object.keys(v).map(
    (k) => k + ": " + $fmt(v[k], $tipiCoz(alanlar[k], esleme), true));
  return ad + " { " + shown.join(", ") + " }";
}

function $str(v) {
  return $fmt(v, undefined, false);
}

// --- uzunluk ve dizinleme --------------------------------------------------
function $len(v) {
  if (v === null || v === undefined) $panic("'none' üzerinde len çağrıldı");
  if (typeof v === "string") return $karakterDizisi(v).length;
  if (Array.isArray(v)) return v.length;
  if (v instanceof Map) return v.size;
  $panic("len bu değer üzerinde tanımlı değil");
}

function $listGet(list, i) {
  if (i < 0 || i >= list.length) {
    $panic("liste sınırı aşıldı: dizin " + i + ", uzunluk " + list.length);
  }
  return list[i];
}

// Metinler kod noktası bazlı dizinlenir (emoji, birleşik karakterler doğru
// sayılsın diye). Her erişimde diziye çevirmek uzun metinlerde O(n²) yapardı;
// bu yüzden uzun metinlerin karakter dizisi küçük bir önbellekte tutulur.
const $DIZI_ONBELLEK = new Map();

const $ONBELLEK_ESIGI = 64;

const $ONBELLEK_BOYU = 4;

function $karakterDizisi(s) {
  if (s.length < $ONBELLEK_ESIGI) return Array.from(s);
  let dizi = $DIZI_ONBELLEK.get(s);
  if (dizi === undefined) {
    dizi = Array.from(s);
    if ($DIZI_ONBELLEK.size >= $ONBELLEK_BOYU) {
      $DIZI_ONBELLEK.delete($DIZI_ONBELLEK.keys().next().value);
    }
    $DIZI_ONBELLEK.set(s, dizi);
  }
  return dizi;
}

function $strGet(s, i) {
  const chars = $karakterDizisi(s);
  if (i < 0 || i >= chars.length) {
    $panic("metin sınırı aşıldı: dizin " + i + ", uzunluk " + chars.length);
  }
  return chars[i];
}

function $mapGet(m, k) {
  return m.has(k) ? m.get(k) : null;
}

function $listIndexOf(list, x) {
  for (let i = 0; i < list.length; i++) if ($eq(list[i], x)) return i;
  return -1;
}

function $listContains(list, x) {
  return $listIndexOf(list, x) !== -1;
}

// Sabit genişliğe getirir; dolgu metni birden çok karakterse kırpılır.
function $metinDoldur(s, genislik, dolgu, sola) {
  if (!dolgu) dolgu = " ";
  const uzunluk = [...s].length;
  if (uzunluk >= genislik) return s;
  let ek = "";
  while ([...ek].length < genislik - uzunluk) ek += dolgu;
  ek = [...ek].slice(0, genislik - uzunluk).join("");
  return sola ? ek + s : s + ek;
}

// --- metin metotları -------------------------------------------------------
function $strSlice(s, a, b) {
  return $karakterDizisi(s).slice(a, b).join("");
}

function $strSplit(s, sep) {
  return sep === "" ? $karakterDizisi(s).slice() : s.split(sep);
}

function $strRepeat(s, n) {
  if (n < 0) $panic("repeat negatif sayı alamaz");
  return s.repeat(n);
}

// --- dönüşümler ------------------------------------------------------------
function $parseIntOpt(s) {
  const t = s.trim();
  if (!/^[+-]?\d+$/.test(t)) return null;
  const n = Number(t);
  return Number.isSafeInteger(n) ? n : null;
}

// --- sayfa (DOM) işlemleri -------------------------------------------------
// Yalnızca tarayıcıda anlamlıdır. Node ile çalıştırıldığında `bul` none
// döndürür ve diğerleri sessizce hiçbir şey yapmaz — program çökmez.
function $belgeVarMi() {
  return typeof document !== "undefined" && document !== null;
}

function $bul(secici) {
  if (!$belgeVarMi()) return null;
  return document.querySelector(secici);
}

function $olustur(etiket) {
  if (!$belgeVarMi()) $panic("olustur() yalnızca tarayıcıda kullanılabilir");
  return document.createElement(etiket);
}

function $govde() {
  if (!$belgeVarMi()) $panic("govde() yalnızca tarayıcıda kullanılabilir");
  return document.body;
}

// O an odakta olan öğe. Arayüz yeniden çizilirken odağın nereye
// döneceğini bilmek için gerekli.
function $odaklanan() {
  if (!$belgeVarMi()) return null;
  const e = document.activeElement;
  if (!e || e === document.body) return null;
  return e;
}

function $ogeOzellik(oge, ad) {
  const deger = oge.getAttribute(ad);
  return deger === null ? null : deger;
}

function $ogeDeger(oge) {
  return oge.value === undefined ? "" : String(oge.value);
}

function $ogeTemizle(oge) {
  while (oge.firstChild) oge.removeChild(oge.firstChild);
}

function $ogeStil(oge, ad, deger) {
  oge.style.setProperty(ad, deger);
}

// Medya sorgusu: ekran genişliği gibi ortam koşulları. Tarayıcı dışında
// hiçbir sorgu eşleşmez ve dinleyici hiç çağrılmaz.
function $medyaEslesir(sorgu) {
  if (typeof matchMedia === "undefined") return false;
  return matchMedia(sorgu).matches;
}

function $medyaDinle(sorgu, islev) {
  if (typeof matchMedia === "undefined") return;
  matchMedia(sorgu).addEventListener("change", (o) => islev(o.matches));
}

function $zamanMetni() {
  const d = new Date();
  const iki = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + iki(d.getMonth() + 1) + "-" + iki(d.getDate()) +
         " " + iki(d.getHours()) + ":" + iki(d.getMinutes()) + ":" + iki(d.getSeconds());
}

// --- programın başlatılması ------------------------------------------------
function $bootstrap(main) {
  try {
    main();
  } catch (err) {
    if (err instanceof NarPanic) {
      const write = (s) => {
        if (typeof process !== "undefined" && process.stderr) process.stderr.write(s + "\n");
        else console.error(s);
      };
      write("panik: " + err.message);
      if (typeof process !== "undefined" && process.exit) process.exit(1);
      return;
    }
    throw err;
  }
}

const STIL = ":root {\n  /* yüzeyler — arkadan öne */\n  --nar-zemin: #FAF8F6;\n  --nar-yuzey: #FFFFFF;\n  --nar-yuzey-2: #F4F1EE;\n  --nar-yuzey-3: #EBE6E1;\n\n  /* metin — koyudan açığa */\n  --nar-metin: #191714;\n  --nar-metin-2: #4A443E;\n  --nar-soluk: #6B6560;\n\n  /* kenarlar */\n  --nar-kenar: #E5E0DA;\n  --nar-kenar-guclu: #D3CCC4;\n\n  /* nar kırmızısı ve anlam renkleri */\n  --nar-vurgu: #A3342E;\n  --nar-vurgu-koyu: #872722;\n  --nar-vurgu-zemin: #FCF2F1;\n  --nar-basari: #2F7A4F;\n  --nar-basari-zemin: #EFF7F2;\n  --nar-uyari: #8A5A00;\n  --nar-uyari-zemin: #FDF6E8;\n  --nar-hata: #B3261E;\n  --nar-hata-zemin: #FDF1F0;\n  --nar-dugme-yazi: #FFFFFF;\n\n  /* tipografi merdiveni */\n  --nar-yazi-xs: 11.5px;\n  --nar-yazi-s: 13px;\n  --nar-yazi-m: 14.5px;\n  --nar-yazi-l: 17px;\n  --nar-yazi-xl: 21px;\n  --nar-yazi-2xl: 27px;\n  --nar-yazi-3xl: 34px;\n\n  /* boşluk merdiveni */\n  --nar-b1: 4px;\n  --nar-b2: 8px;\n  --nar-b3: 12px;\n  --nar-b4: 16px;\n  --nar-b5: 24px;\n  --nar-b6: 32px;\n  --nar-b7: 48px;\n\n  /* derinlik — gölge sıcak, saf siyah değil */\n  --nar-golge-1: 0 1px 2px rgba(26, 24, 21, .05);\n  --nar-golge-2: 0 1px 2px rgba(26, 24, 21, .04),\n                 0 6px 16px -8px rgba(26, 24, 21, .16);\n  --nar-golge-3: 0 2px 4px rgba(26, 24, 21, .05),\n                 0 14px 32px -12px rgba(26, 24, 21, .22);\n\n  --nar-yuvarlak: 8px;\n  --nar-yuvarlak-s: 6px;\n  --nar-gecis: .16s;\n  --nar-genislik: 820px;\n\n  /* Web fontu yüklenmediyse sistem yazı tipi kullanılır; `fontKur()`\n     bu değişkenin başına bir aile ekler. */\n  --nar-govde: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,\n               'Helvetica Neue', Arial, sans-serif;\n  --nar-tek: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas,\n             'Liberation Mono', monospace;\n  color-scheme: light;\n}\n\n@media (prefers-color-scheme: dark) {\n  :root:not([data-nar-tema='acik']) {\n    --nar-zemin: #18160F;\n    --nar-yuzey: #221F1B;\n    --nar-yuzey-2: #2B2721;\n    --nar-yuzey-3: #363028;\n    --nar-metin: #EFECE7;\n    --nar-metin-2: #BDB6AD;\n    --nar-soluk: #A29B93;\n    --nar-kenar: #38322A;\n    --nar-kenar-guclu: #4A4238;\n    --nar-vurgu: #E8756C;\n    --nar-vurgu-koyu: #F0908A;\n    --nar-vurgu-zemin: #2A1E1C;\n    --nar-basari: #6FC395;\n    --nar-basari-zemin: #1B2620;\n    --nar-uyari: #D7A64A;\n    --nar-uyari-zemin: #2A2418;\n    --nar-hata: #F08079;\n    --nar-hata-zemin: #2B1C1B;\n    /* Zemin açıldığı için yazı koyulaşır: beyaz yazı burada 2.9:1\n       kalıyordu, bu koyu ton 6.0:1 veriyor. */\n    --nar-dugme-yazi: #2B1210;\n    /* Koyu zeminde gölge görünmez; derinlik üstten gelen ince bir\n       aydınlıkla anlatılır. */\n    --nar-golge-1: 0 1px 0 rgba(255, 255, 255, .04) inset;\n    --nar-golge-2: 0 1px 0 rgba(255, 255, 255, .05) inset,\n                   0 8px 20px -12px rgba(0, 0, 0, .8);\n    --nar-golge-3: 0 1px 0 rgba(255, 255, 255, .07) inset,\n                   0 18px 36px -16px rgba(0, 0, 0, .95);\n    color-scheme: dark;\n  }\n}\n\n:root[data-nar-tema='koyu'] {\n  --nar-zemin: #18160F;\n  --nar-yuzey: #221F1B;\n  --nar-yuzey-2: #2B2721;\n  --nar-yuzey-3: #363028;\n  --nar-metin: #EFECE7;\n  --nar-metin-2: #BDB6AD;\n  --nar-soluk: #A29B93;\n  --nar-kenar: #38322A;\n  --nar-kenar-guclu: #4A4238;\n  --nar-vurgu: #E8756C;\n  --nar-vurgu-koyu: #F0908A;\n  --nar-vurgu-zemin: #2A1E1C;\n  --nar-basari: #6FC395;\n  --nar-basari-zemin: #1B2620;\n  --nar-uyari: #D7A64A;\n  --nar-uyari-zemin: #2A2418;\n  --nar-hata: #F08079;\n  --nar-hata-zemin: #2B1C1B;\n  --nar-dugme-yazi: #2B1210;\n  --nar-golge-1: 0 1px 0 rgba(255, 255, 255, .04) inset;\n  --nar-golge-2: 0 1px 0 rgba(255, 255, 255, .05) inset,\n                 0 8px 20px -12px rgba(0, 0, 0, .8);\n  --nar-golge-3: 0 1px 0 rgba(255, 255, 255, .07) inset,\n                 0 18px 36px -16px rgba(0, 0, 0, .95);\n  color-scheme: dark;\n}\n\n/* --- kök ---------------------------------------------------------------- */\n\n.nar-kok {\n  background: var(--nar-zemin);\n  color: var(--nar-metin);\n  font: var(--nar-yazi-m)/1.6 var(--nar-govde);\n  padding-block: var(--nar-b5);\n  padding-inline: var(--nar-b5);\n  /* Sayfa iskeleti bileşenleri bunu okuyup kendilerini kenara taşır;\n     kapalı kaplar sıfırlar. */\n  --nar-ic-bosluk: var(--nar-b5);\n  max-width: var(--nar-genislik);\n  margin: 0 auto;\n  box-sizing: border-box;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n.nar-kok *, .nar-kok *::before, .nar-kok *::after { box-sizing: border-box; }\n\n/* --- yazı --------------------------------------------------------------- */\n\n.nar-baslik { font-size: var(--nar-yazi-2xl); font-weight: 660;\n  letter-spacing: -0.021em; line-height: 1.22; margin: 0;\n  text-wrap: balance; }\n.nar-altbaslik { font-size: var(--nar-yazi-l); font-weight: 620;\n  letter-spacing: -0.012em; line-height: 1.35; margin: 0;\n  text-wrap: balance; }\n.nar-metin { margin: 0; }\n.nar-paragraf { margin: 0; max-width: 66ch; color: var(--nar-metin-2); }\n.nar-etiket { font-size: var(--nar-yazi-xs); font-weight: 620;\n  letter-spacing: 0.075em; text-transform: uppercase;\n  color: var(--nar-soluk); margin: 0; }\n/* Etiketin büyük harfe çevirmeyen kardeşi: açıklama satırları için. */\n.nar-solukyazi { font-size: var(--nar-yazi-s); color: var(--nar-soluk);\n  margin: 0; }\n\n/* Rozet içeriği kadar yer kaplar. Sütun yerleşiminin içinde\n   `align-self` olmadan tam genişliğe yayılıp çubuğa dönüşüyordu. */\n.nar-rozet { display: inline-flex; align-items: center; gap: var(--nar-b1);\n  font-size: var(--nar-yazi-s); font-weight: 600; line-height: 1.45;\n  padding: 2px 10px; border-radius: 999px; align-self: flex-start;\n  white-space: nowrap; }\n.nar-rozet-bilgi { background: var(--nar-vurgu-zemin); color: var(--nar-vurgu); }\n.nar-rozet-basari { background: var(--nar-basari-zemin); color: var(--nar-basari); }\n.nar-rozet-uyari { background: var(--nar-uyari-zemin); color: var(--nar-uyari); }\n.nar-rozet-hata { background: var(--nar-hata-zemin); color: var(--nar-hata); }\n.nar-rozet-notr { background: var(--nar-yuzey-2); color: var(--nar-metin-2); }\n\n.nar-bag { color: var(--nar-vurgu); text-underline-offset: 2px;\n  text-decoration-thickness: 1px; }\n.nar-bag:hover { color: var(--nar-vurgu-koyu); }\n\n.nar-alinti { margin: 0; padding-left: var(--nar-b4);\n  border-left: 2px solid var(--nar-kenar-guclu);\n  display: flex; flex-direction: column; gap: var(--nar-b2); }\n.nar-alinti-metin { font-size: var(--nar-yazi-l); line-height: 1.5;\n  letter-spacing: -0.008em; margin: 0; max-width: 58ch; }\n.nar-alinti-kaynak { font-size: var(--nar-yazi-s); color: var(--nar-soluk);\n  margin: 0; }\n\n/* --- simge -------------------------------------------------------------- */\n/* SVG'ler yazı rengini alır; boyut yazı boyutuna bağlıdır. */\n\n.nar-simge { display: inline-flex; align-items: center;\n  justify-content: center; flex: none; width: 1.15em; height: 1.15em;\n  color: inherit; }\n.nar-simge svg { width: 100%; height: 100%; display: block; }\n\n/* --- düğmeler ----------------------------------------------------------- */\n\n.nar-dugme, .nar-dugme-ikincil, .nar-dugme-sessiz, .nar-dugme-tehlike {\n  display: inline-flex; align-items: center; justify-content: center;\n  gap: var(--nar-b2);\n  font: inherit; font-weight: 560; letter-spacing: -0.006em;\n  padding: 9px 16px; min-height: 40px;\n  border-radius: var(--nar-yuvarlak); border: 1px solid transparent;\n  cursor: pointer; align-self: flex-start; white-space: nowrap;\n  transition: background-color var(--nar-gecis),\n              border-color var(--nar-gecis),\n              box-shadow var(--nar-gecis), transform .05s;\n}\n.nar-dugme { background: var(--nar-vurgu); color: var(--nar-dugme-yazi);\n  box-shadow: var(--nar-golge-1); }\n.nar-dugme:hover { background: var(--nar-vurgu-koyu); }\n.nar-dugme-ikincil { background: var(--nar-yuzey); color: var(--nar-metin);\n  border-color: var(--nar-kenar-guclu); box-shadow: var(--nar-golge-1); }\n.nar-dugme-ikincil:hover { background: var(--nar-yuzey-2); }\n.nar-dugme-sessiz { background: transparent; color: var(--nar-metin-2); }\n.nar-dugme-sessiz:hover { background: var(--nar-yuzey-2);\n  color: var(--nar-metin); }\n.nar-dugme-tehlike { background: var(--nar-hata-zemin); color: var(--nar-hata);\n  border-color: transparent; }\n.nar-dugme-tehlike:hover { border-color: var(--nar-hata); }\n.nar-dugme:active, .nar-dugme-ikincil:active,\n.nar-dugme-sessiz:active, .nar-dugme-tehlike:active { transform: translateY(1px); }\n.nar-dugme[disabled], .nar-dugme-ikincil[disabled],\n.nar-dugme-sessiz[disabled], .nar-dugme-tehlike[disabled] {\n  opacity: .5; cursor: not-allowed; }\n\n/* Yalnız simge taşıyan düğme kare olur; etiketi ekran okuyucuya kalır. */\n.nar-ikon-dugme { display: inline-flex; align-items: center;\n  justify-content: center; width: 36px; height: 36px; padding: 0;\n  font: inherit; background: transparent; color: var(--nar-metin-2);\n  border: 1px solid transparent; border-radius: var(--nar-yuvarlak-s);\n  cursor: pointer; flex: none;\n  transition: background-color var(--nar-gecis), color var(--nar-gecis); }\n.nar-ikon-dugme:hover { background: var(--nar-yuzey-2); color: var(--nar-metin); }\n\n/* --- girdi -------------------------------------------------------------- */\n\n.nar-giris, .nar-coksatir, .nar-secim {\n  font: inherit; padding: 9px 11px; min-height: 40px;\n  background: var(--nar-yuzey); color: var(--nar-metin);\n  border: 1px solid var(--nar-kenar-guclu);\n  border-radius: var(--nar-yuvarlak);\n  width: 100%; max-width: 360px;\n  transition: border-color var(--nar-gecis), box-shadow var(--nar-gecis);\n}\n.nar-coksatir { min-height: 88px; resize: vertical; font-family: inherit;\n  line-height: 1.55; }\n.nar-giris::placeholder, .nar-coksatir::placeholder { color: var(--nar-soluk); }\n.nar-giris:focus, .nar-coksatir:focus, .nar-secim:focus {\n  outline: none; border-color: var(--nar-vurgu);\n  box-shadow: 0 0 0 3px var(--nar-vurgu-zemin); }\n\n/* Klavyeyle gezinen herkes nerede olduğunu görmeli. */\n.nar-kok :focus-visible { outline: 2px solid var(--nar-vurgu);\n  outline-offset: 2px; }\n\n.nar-onay { display: inline-flex; align-items: center; gap: var(--nar-b2);\n  cursor: pointer; user-select: none; }\n.nar-onay input { width: 18px; height: 18px; accent-color: var(--nar-vurgu);\n  cursor: pointer; margin: 0; flex: none; }\n\n/* Etiketli form alanı: etiket, içerik, altında ipucu ya da hata. */\n.nar-alan { display: flex; flex-direction: column; gap: 6px; width: 100%;\n  align-items: flex-start; }\n.nar-alan-etiket { font-size: var(--nar-yazi-s); font-weight: 580;\n  color: var(--nar-metin); margin: 0; }\n.nar-alan-ipucu { font-size: var(--nar-yazi-s); color: var(--nar-soluk);\n  margin: 0; }\n.nar-alan-hatali .nar-giris, .nar-alan-hatali .nar-coksatir,\n.nar-alan-hatali .nar-secim { border-color: var(--nar-hata); }\n.nar-alan-hatali .nar-alan-ipucu { color: var(--nar-hata); }\n\n/* Anahtar: açık/kapalı. Gerçek bir onay kutusu üstüne çizilir, böylece\n   klavye ve ekran okuyucu kendiliğinden çalışır. */\n.nar-anahtar { display: inline-flex; align-items: center;\n  gap: var(--nar-b3); cursor: pointer; user-select: none; }\n.nar-anahtar input { position: absolute; opacity: 0; width: 0; height: 0; }\n.nar-anahtar-yuva { width: 40px; height: 24px; flex: none;\n  background: var(--nar-yuzey-3); border-radius: 999px;\n  position: relative;\n  transition: background-color var(--nar-gecis); }\n.nar-anahtar-yuva::after { content: ''; position: absolute;\n  top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 999px;\n  background: var(--nar-yuzey); box-shadow: var(--nar-golge-1);\n  transition: transform var(--nar-gecis); }\n.nar-anahtar input:checked + .nar-anahtar-yuva { background: var(--nar-vurgu); }\n.nar-anahtar input:checked + .nar-anahtar-yuva::after {\n  transform: translateX(16px); }\n.nar-anahtar input:focus-visible + .nar-anahtar-yuva {\n  outline: 2px solid var(--nar-vurgu); outline-offset: 2px; }\n\n.nar-radyo { display: flex; flex-direction: column; gap: var(--nar-b2);\n  align-items: flex-start; }\n.nar-radyo-oge { display: inline-flex; align-items: center;\n  gap: var(--nar-b2); cursor: pointer; user-select: none; }\n.nar-radyo-oge input { width: 18px; height: 18px; margin: 0; flex: none;\n  accent-color: var(--nar-vurgu); cursor: pointer; }\n\n.nar-kaydirici { display: flex; align-items: center; gap: var(--nar-b3);\n  width: 100%; max-width: 360px; }\n.nar-kaydirici input { flex: 1; min-width: 0; accent-color: var(--nar-vurgu);\n  height: 24px; }\n.nar-kaydirici-deger { font-size: var(--nar-yazi-s); font-weight: 580;\n  color: var(--nar-metin-2); font-variant-numeric: tabular-nums;\n  min-width: 3ch; text-align: right; }\n\n/* --- yerleşim ----------------------------------------------------------- */\n\n/* Sütun çocuklarını genişletir: içine konan kart, tablo ya da ızgara\n   kendi satırının tamamını kaplasın. İçeriği kadar yer tutması gereken\n   öğeler (düğme, rozet, anahtar) aşağıda tek tek `align-self` alır —\n   tersi yapılırsa her kart içeriği kadar daralıyor, sayfa dar bir\n   sütuna sıkışıyordu. */\n.nar-sutun { display: flex; flex-direction: column; gap: var(--nar-b3);\n  align-items: stretch; }\n.nar-sutun > .nar-onay, .nar-sutun > .nar-anahtar,\n.nar-sutun > .nar-avatar, .nar-sutun > .nar-simge,\n.nar-sutun > .nar-ikon-dugme, .nar-sutun > .nar-menu,\n.nar-sutun > .nar-ipucu-sarmal, .nar-sutun > .nar-sayfalama,\n.nar-sutun > .nar-rozet { align-self: flex-start; }\n.nar-satir { display: flex; flex-direction: row; gap: var(--nar-b3);\n  align-items: center; flex-wrap: wrap; }\n.nar-esnek { display: flex; flex-wrap: wrap; gap: var(--nar-b3);\n  align-items: stretch; }\n.nar-kutu, .nar-kart { display: flex; flex-direction: column;\n  gap: var(--nar-b3); background: var(--nar-yuzey);\n  border: 1px solid var(--nar-kenar); border-radius: 12px;\n  padding: var(--nar-b5); width: 100%; box-shadow: var(--nar-golge-1); }\n.nar-kart-baslik { font-size: var(--nar-yazi-l); font-weight: 620;\n  letter-spacing: -0.012em; margin: 0; }\n/* Satır ve esnek içindeki kutular yeri paylaşır; tek başına kutu tam\n   genişliktir. Bu kural olmadan üç kutu geniş ekranda da alt alta\n   diziliyor, `Esnek` hiç sarmıyordu. */\n.nar-satir > .nar-kutu, .nar-esnek > .nar-kutu { width: auto; flex: 1 1 160px; }\n/* Genişliği sınırlanmış sarmalayıcı da yer paylaşır; yoksa satırda\n   içeriği kadar daralıp verilen ölçüye hiç ulaşmıyordu. */\n.nar-satir > .nar-en, .nar-esnek > .nar-en { flex: 1 1 auto; }\n/* Satır öğeleri ortalanır (rozet, düğme, metin böyle doğru durur) ama\n   yan yana konan kutular üstten hizalanıp aynı boyu paylaşmalı. */\n.nar-satir > .nar-kutu, .nar-satir > .nar-kart, .nar-satir > .nar-takvim,\n.nar-satir > .nar-en, .nar-satir > .nar-tablo-sarmal,\n.nar-satir > .nar-akordeon { align-self: stretch; }\n.nar-ortala { display: flex; justify-content: center; width: 100%; }\n/* Satırın iki ucuna yaslar: solda ad, sağda değer. Dar ekranda sarar. */\n.nar-satir-yay { display: flex; flex-direction: row; align-items: center;\n  justify-content: space-between; gap: var(--nar-b3); flex-wrap: wrap;\n  width: 100%; }\n/* Genişliği sınırlanmış sarmalayıcı; ölçü `--nar-en` ile gelir. */\n.nar-en { width: 100%; max-width: var(--nar-en, 420px); }\n\n/* Izgara: sütun sayısı `--nar-sutun` ile gelir, dar ekranda teke iner. */\n.nar-izgara { display: grid; width: 100%; gap: var(--nar-b3);\n  grid-template-columns: repeat(var(--nar-sutun, 2), minmax(0, 1fr)); }\n\n/* Kalan yeri kaplayan boşluk: yan yana kartlarda alt satırları aynı\n   çizgiye getirir. */\n.nar-doldur { flex: 1 1 auto; min-height: 0; }\n\n.nar-ayrac { display: flex; align-items: center; gap: var(--nar-b3);\n  width: 100%; color: var(--nar-soluk); font-size: var(--nar-yazi-xs);\n  font-weight: 620; letter-spacing: 0.075em; text-transform: uppercase; }\n.nar-ayrac::before, .nar-ayrac::after { content: ''; height: 1px; flex: 1;\n  background: var(--nar-kenar); }\n\n/* --- gösterim ----------------------------------------------------------- */\n\n.nar-uyari { display: flex; gap: var(--nar-b3); padding: var(--nar-b3) var(--nar-b4);\n  border-radius: var(--nar-yuvarlak); font-size: var(--nar-yazi-m);\n  width: 100%; align-items: flex-start; line-height: 1.5; }\n.nar-uyari .nar-simge { margin-top: 2px; }\n.nar-uyari-bilgi { background: var(--nar-vurgu-zemin); color: var(--nar-vurgu); }\n.nar-uyari-basari { background: var(--nar-basari-zemin); color: var(--nar-basari); }\n.nar-uyari-uyari { background: var(--nar-uyari-zemin); color: var(--nar-uyari); }\n.nar-uyari-hata { background: var(--nar-hata-zemin); color: var(--nar-hata); }\n\n.nar-liste { margin: 0; padding-left: 22px; display: flex;\n  flex-direction: column; gap: 5px; color: var(--nar-metin-2); }\n\n.nar-tablo-sarmal { width: 100%; overflow-x: auto;\n  border: 1px solid var(--nar-kenar); border-radius: 10px;\n  background: var(--nar-yuzey); }\n.nar-tablo { width: 100%; border-collapse: collapse;\n  font-size: var(--nar-yazi-m); font-variant-numeric: tabular-nums; }\n.nar-tablo th { text-align: left; font-weight: 600; color: var(--nar-soluk);\n  font-size: var(--nar-yazi-xs); letter-spacing: 0.06em;\n  text-transform: uppercase; padding: 10px var(--nar-b4);\n  background: var(--nar-yuzey-2); white-space: nowrap;\n  border-bottom: 1px solid var(--nar-kenar); }\n.nar-tablo td { padding: 11px var(--nar-b4);\n  border-bottom: 1px solid var(--nar-kenar); }\n.nar-tablo tbody tr:last-child td { border-bottom: none; }\n.nar-tablo tbody tr { transition: background-color var(--nar-gecis); }\n.nar-tablo tbody tr:hover { background: var(--nar-yuzey-2); }\n\n.nar-ilerleme { width: 100%; max-width: 360px; height: 8px;\n  background: var(--nar-yuzey-3); border-radius: 999px; overflow: hidden; }\n.nar-ilerleme-dolu { height: 100%; background: var(--nar-vurgu);\n  border-radius: 999px; transition: width .25s; }\n\n.nar-sekmeler { display: flex; gap: 2px;\n  border-bottom: 1px solid var(--nar-kenar); width: 100%; overflow-x: auto;\n  scrollbar-width: none; }\n.nar-sekmeler::-webkit-scrollbar { display: none; }\n.nar-sekme { font: inherit; font-weight: 560; padding: 9px 14px;\n  background: none; border: none; border-bottom: 2px solid transparent;\n  color: var(--nar-soluk); cursor: pointer; white-space: nowrap;\n  margin-bottom: -1px;\n  transition: color var(--nar-gecis), border-color var(--nar-gecis); }\n.nar-sekme:hover { color: var(--nar-metin); }\n.nar-sekme-secili { color: var(--nar-vurgu);\n  border-bottom-color: var(--nar-vurgu); }\n\n.nar-cizgi { height: 1px; background: var(--nar-kenar); width: 100%;\n  border: none; margin: 2px 0; }\n.nar-resim { max-width: 100%; height: auto; border-radius: 10px;\n  display: block; }\n\n/* Sayı kutusu: bir ölçüm, bir de nereye gittiği. */\n.nar-istatistik { display: flex; flex-direction: column; gap: 2px;\n  padding: var(--nar-b4); background: var(--nar-yuzey);\n  border: 1px solid var(--nar-kenar); border-radius: 12px;\n  width: auto; flex: 1 1 150px; box-shadow: var(--nar-golge-1); }\n.nar-istatistik-baslik { font-size: var(--nar-yazi-s); color: var(--nar-soluk);\n  margin: 0; }\n.nar-istatistik-deger { font-size: var(--nar-yazi-2xl); font-weight: 640;\n  letter-spacing: -0.025em; line-height: 1.15; margin: 0;\n  font-variant-numeric: tabular-nums; }\n.nar-istatistik-degisim { font-size: var(--nar-yazi-s); font-weight: 560;\n  margin: 0; display: inline-flex; align-items: center; gap: 3px; }\n.nar-degisim-arti { color: var(--nar-basari); }\n.nar-degisim-eksi { color: var(--nar-hata); }\n.nar-degisim-notr { color: var(--nar-soluk); }\n\n/* Adı olan herkesin bir yüzü olsun: resim yoksa baş harfler. */\n.nar-avatar { display: inline-flex; align-items: center;\n  justify-content: center; width: 36px; height: 36px; flex: none;\n  border-radius: 999px; background: var(--nar-vurgu-zemin);\n  color: var(--nar-vurgu); font-size: var(--nar-yazi-s); font-weight: 640;\n  overflow: hidden; user-select: none; }\n.nar-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }\n\n/* Mini çubuk grafiği: değerler kendi en büyüğüne göre ölçeklenir.\n   Çubuk kendi sabit yükseklikli alanında durur — etiketle aynı kutuyu\n   paylaşsaydı flex küçültmesi uzun çubukları eziyor, ölçek bozuluyordu. */\n.nar-cubuklar { display: flex; align-items: flex-end; gap: 6px;\n  width: 100%; padding-top: var(--nar-b2); }\n.nar-cubuk-sutun { display: flex; flex-direction: column;\n  align-items: center; gap: 6px; flex: 1; min-width: 0; }\n.nar-cubuk-alan { width: 100%; height: 96px; display: flex;\n  align-items: flex-end; }\n.nar-cubuk { width: 100%; flex: none; background: var(--nar-vurgu);\n  border-radius: 4px; min-height: 2px; transition: height .3s; }\n.nar-cubuk-etiket { font-size: var(--nar-yazi-xs); color: var(--nar-soluk);\n  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\n  max-width: 100%; }\n\n/* Katlanır bölüm. Başlık bir düğme; ok açıkken döner. */\n.nar-akordeon { display: flex; flex-direction: column; width: 100%;\n  border: 1px solid var(--nar-kenar); border-radius: 12px;\n  background: var(--nar-yuzey); overflow: hidden; }\n.nar-akordeon-bolum + .nar-akordeon-bolum {\n  border-top: 1px solid var(--nar-kenar); }\n.nar-akordeon-basi { display: flex; align-items: center;\n  justify-content: space-between; gap: var(--nar-b3); width: 100%;\n  font: inherit; font-weight: 560; text-align: left; cursor: pointer;\n  padding: var(--nar-b3) var(--nar-b4); background: none; border: none;\n  color: var(--nar-metin);\n  transition: background-color var(--nar-gecis); }\n.nar-akordeon-basi:hover { background: var(--nar-yuzey-2); }\n.nar-akordeon-ok { transition: transform var(--nar-gecis);\n  color: var(--nar-soluk); }\n.nar-akordeon-acik .nar-akordeon-ok { transform: rotate(90deg); }\n.nar-akordeon-govde { padding: 0 var(--nar-b4) var(--nar-b4);\n  display: flex; flex-direction: column; gap: var(--nar-b3);\n  align-items: flex-start; color: var(--nar-metin-2); }\n\n/* Adımlar: nerede olduğunu ve kaç adım kaldığını gösterir. */\n.nar-adimlar { display: flex; align-items: flex-start; width: 100%;\n  gap: 0; overflow-x: auto; scrollbar-width: none; }\n.nar-adimlar::-webkit-scrollbar { display: none; }\n.nar-adim { display: flex; flex-direction: column; align-items: center;\n  gap: 6px; flex: 1; min-width: 76px; position: relative; text-align: center; }\n.nar-adim-yuvarlak { width: 28px; height: 28px; border-radius: 999px;\n  display: flex; align-items: center; justify-content: center;\n  font-size: var(--nar-yazi-s); font-weight: 640; flex: none;\n  background: var(--nar-yuzey-2); color: var(--nar-soluk);\n  border: 1px solid var(--nar-kenar); }\n.nar-adim-yazi { font-size: var(--nar-yazi-s); color: var(--nar-soluk);\n  padding-inline: 4px; }\n.nar-adim-bitti .nar-adim-yuvarlak { background: var(--nar-basari-zemin);\n  color: var(--nar-basari); border-color: transparent; }\n.nar-adim-simdi .nar-adim-yuvarlak { background: var(--nar-vurgu);\n  color: var(--nar-dugme-yazi); border-color: transparent; }\n.nar-adim-simdi .nar-adim-yazi { color: var(--nar-metin); font-weight: 580; }\n/* Çizgi yuvarlakların ortasından geçer, ilkinin solunda durmaz. */\n.nar-adim::before { content: ''; position: absolute; top: 14px;\n  left: -50%; width: 100%; height: 1px; background: var(--nar-kenar); }\n.nar-adim:first-child::before { display: none; }\n.nar-adim-bitti::before, .nar-adim-simdi::before {\n  background: var(--nar-basari); }\n\n/* Boş durum: bir şey yokken ne yapılacağını söyler. */\n.nar-bos-durum { display: flex; flex-direction: column; align-items: center;\n  justify-content: center; gap: var(--nar-b3); width: 100%;\n  padding: var(--nar-b7) var(--nar-b5); text-align: center;\n  background: var(--nar-yuzey); border: 1px dashed var(--nar-kenar-guclu);\n  border-radius: 12px; }\n.nar-bos-durum .nar-simge { width: 32px; height: 32px;\n  color: var(--nar-soluk); }\n.nar-bos-baslik { font-size: var(--nar-yazi-l); font-weight: 620;\n  margin: 0; letter-spacing: -0.012em; }\n.nar-bos-aciklama { font-size: var(--nar-yazi-m); color: var(--nar-soluk);\n  margin: 0; max-width: 44ch; }\n\n/* Kod bloğu. Uzun satır sarmaz, kendi içinde kayar. */\n.nar-kod { width: 100%; margin: 0; padding: var(--nar-b4);\n  background: var(--nar-yuzey-2); border: 1px solid var(--nar-kenar);\n  border-radius: 10px; overflow-x: auto;\n  font: var(--nar-yazi-s)/1.65 var(--nar-tek); color: var(--nar-metin);\n  tab-size: 2; }\n.nar-kod code { font: inherit; white-space: pre; }\n\n/* Sayfalama */\n.nar-sayfalama { display: flex; align-items: center; gap: var(--nar-b2);\n  flex-wrap: wrap; }\n.nar-sayfa-no { font-size: var(--nar-yazi-s); color: var(--nar-soluk);\n  font-variant-numeric: tabular-nums; padding-inline: var(--nar-b2); }\n\n/* Açılır menü. Perde yok: dışarı tıklanınca kapanır. */\n.nar-menu { position: relative; display: inline-flex; }\n.nar-menu-liste { position: absolute; top: calc(100% + 6px); left: 0;\n  z-index: 30; min-width: 180px; padding: var(--nar-b1);\n  background: var(--nar-yuzey); border: 1px solid var(--nar-kenar);\n  border-radius: 10px; box-shadow: var(--nar-golge-3);\n  display: flex; flex-direction: column; }\n.nar-menu-oge { font: inherit; text-align: left; padding: 8px 10px;\n  background: none; border: none; border-radius: var(--nar-yuvarlak-s);\n  color: var(--nar-metin); cursor: pointer; white-space: nowrap;\n  transition: background-color var(--nar-gecis); }\n.nar-menu-oge:hover { background: var(--nar-yuzey-2); }\n\n/* İletişim kutusu: sayfanın üstünde, ortada. */\n.nar-perde { position: fixed; inset: 0; z-index: 40;\n  background: rgba(26, 24, 21, .38);\n  display: flex; align-items: center; justify-content: center;\n  padding: var(--nar-b4); }\n.nar-iletisim { width: 100%; max-width: 440px; max-height: 84vh;\n  overflow-y: auto; background: var(--nar-yuzey);\n  border: 1px solid var(--nar-kenar); border-radius: 14px;\n  box-shadow: var(--nar-golge-3); padding: var(--nar-b5);\n  display: flex; flex-direction: column; gap: var(--nar-b3);\n  align-items: flex-start; }\n.nar-iletisim-basi { display: flex; align-items: flex-start;\n  justify-content: space-between; gap: var(--nar-b3); width: 100%; }\n\n/* İpucu: üstüne gelince görünen küçük not. */\n.nar-ipucu-sarmal { position: relative; display: inline-flex; }\n.nar-ipucu-balon { position: absolute; bottom: calc(100% + 8px); left: 50%;\n  transform: translateX(-50%); z-index: 35;\n  background: var(--nar-metin); color: var(--nar-zemin);\n  font-size: var(--nar-yazi-s); line-height: 1.4;\n  padding: 6px 10px; border-radius: var(--nar-yuvarlak-s);\n  white-space: nowrap; pointer-events: none;\n  opacity: 0; transition: opacity var(--nar-gecis); }\n.nar-ipucu-sarmal:hover .nar-ipucu-balon,\n.nar-ipucu-sarmal:focus-within .nar-ipucu-balon { opacity: 1; }\n\n/* --- takvim ------------------------------------------------------------- */\n/* Bir aralık seçicidir: giriş günü, aradaki geceler ve çıkış günü ayrı\n   görünür. Uçlar yuvarlak, aradakiler düz — böylece seçim tek bir şerit\n   gibi okunur. */\n\n.nar-takvim { display: flex; flex-direction: column; gap: var(--nar-b3);\n  width: 100%; background: var(--nar-yuzey);\n  border: 1px solid var(--nar-kenar); border-radius: 12px;\n  padding: var(--nar-b4); box-shadow: var(--nar-golge-1); }\n\n.nar-takvim-basi { display: flex; align-items: center;\n  justify-content: space-between; gap: var(--nar-b3); width: 100%; }\n.nar-takvim-baslik { font-size: var(--nar-yazi-m); font-weight: 620;\n  letter-spacing: -0.01em; }\n\n.nar-takvim-aylar { display: flex; gap: var(--nar-b5); width: 100%; }\n.nar-ay { display: flex; flex-direction: column; gap: 6px; flex: 1;\n  min-width: 0; }\n.nar-ay-adi { text-align: center; font-size: var(--nar-yazi-s);\n  font-weight: 620; color: var(--nar-metin); padding-bottom: 2px; }\n\n.nar-gun-basliklari, .nar-gunler {\n  display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }\n.nar-gun-basliklari { gap: 2px; }\n.nar-gun-basligi { text-align: center; font-size: var(--nar-yazi-xs);\n  font-weight: 620; letter-spacing: 0.04em; color: var(--nar-soluk);\n  padding-bottom: 4px; }\n/* Hücreler arası boşluk yok: seçili aralık kesintisiz bir şerit olsun. */\n.nar-gunler { gap: 0 0; row-gap: 2px; }\n\n.nar-gun { position: relative; display: flex; align-items: center;\n  justify-content: center; aspect-ratio: 1 / 1; min-height: 34px;\n  font-size: var(--nar-yazi-s); font-variant-numeric: tabular-nums;\n  border: none; background: transparent; color: var(--nar-metin);\n  font-family: inherit; cursor: pointer; border-radius: 999px;\n  transition: background-color var(--nar-gecis), color var(--nar-gecis); }\n.nar-gun:hover { background: var(--nar-yuzey-2); }\n.nar-gun-bos { visibility: hidden; pointer-events: none; }\n.nar-gun-kapali { color: var(--nar-soluk); opacity: .45;\n  cursor: not-allowed; }\n.nar-gun-kapali:hover { background: transparent; }\n/* Bugün: altında küçük bir nokta. Renk ayırt etmeye yetmiyor. */\n.nar-gun-bugun::after { content: ''; position: absolute; bottom: 5px;\n  left: 50%; transform: translateX(-50%); width: 4px; height: 4px;\n  border-radius: 999px; background: var(--nar-vurgu); }\n\n.nar-gun-arada { background: var(--nar-vurgu-zemin); border-radius: 0; }\n.nar-gun-arada:hover { background: var(--nar-vurgu-zemin); }\n.nar-gun-bas, .nar-gun-son {\n  background: var(--nar-vurgu); color: var(--nar-dugme-yazi);\n  font-weight: 620; }\n.nar-gun-bas:hover, .nar-gun-son:hover { background: var(--nar-vurgu-koyu); }\n.nar-gun-bas::after, .nar-gun-son::after { background: var(--nar-dugme-yazi); }\n/* Şeridin uçları: giriş günü solda yuvarlak, çıkış günü sağda. */\n.nar-gun-bas { border-radius: 999px 0 0 999px; }\n.nar-gun-son { border-radius: 0 999px 999px 0; }\n.nar-gun-tek { border-radius: 999px; }\n/* Aralık bir hafta satırında bitiyorsa şerit orada da yuvarlansın;\n   düz kesilen kenar seçimin devam ettiği izlenimi veriyordu. */\n.nar-gunler > .nar-gun-arada:nth-child(7n + 1) { border-radius: 999px 0 0 999px; }\n.nar-gunler > .nar-gun-arada:nth-child(7n) { border-radius: 0 999px 999px 0; }\n\n.nar-takvim-alt { display: flex; align-items: center;\n  justify-content: space-between; gap: var(--nar-b3); width: 100%;\n  flex-wrap: wrap; border-top: 1px solid var(--nar-kenar);\n  padding-top: var(--nar-b3); }\n.nar-takvim-ozet { display: flex; flex-direction: column; gap: 2px; }\n.nar-takvim-aralik { font-size: var(--nar-yazi-m); font-weight: 560; }\n.nar-takvim-gece { font-size: var(--nar-yazi-s); color: var(--nar-soluk); }\n\n@media (max-width: 600px) {\n  /* İki ay yan yana 400 px'e sığmıyor; ikincisi gizlenir. */\n  .nar-takvim-aylar > .nar-ay + .nar-ay { display: none; }\n}\n\n/* Boşluksuz sütun: üst şerit, açılış ve dip aralarında şerit bırakmadan\n   dizilsin diye. `Sutun` boşluk verir, bu vermez. */\n.nar-yigin { display: flex; flex-direction: column; align-items: stretch;\n  width: 100%; }\n\n/* --- sayfa iskeleti ------------------------------------------------------ */\n/*\n   Üst şerit, açılış, bölüm ve dip kök sütunda kenardan kenara uzar; bir\n   kartın ya da önizlemenin içindeyken hizada kalır. İkisini ayıran tek şey\n   `--nar-ic-bosluk`: kök onu kendi yan boşluğuna eşitler, kapalı kaplar\n   sıfırlar. Böylece aynı bileşen iki bağlamda da doğru duruyor. */\n\n.nar-gezinti, .nar-kahraman, .nar-altbilgi {\n  width: 100%;\n  margin-inline: calc(-1 * var(--nar-ic-bosluk, 0px));\n  padding-inline: var(--nar-b5);\n}\n.nar-kutu, .nar-kart, .nar-onizleme, .nar-iletisim, .nar-yanpanel,\n.nar-akordeon-govde, .nar-katla-govde { --nar-ic-bosluk: 0px; }\n\n/* Üst şerit */\n.nar-gezinti { background: var(--nar-yuzey);\n  border-bottom: 1px solid var(--nar-kenar); }\n.nar-gezinti-ic { display: flex; align-items: center; gap: var(--nar-b4);\n  max-width: var(--nar-genislik); margin-inline: auto;\n  min-height: 56px; }\n.nar-marka { font-size: var(--nar-yazi-l); font-weight: 680;\n  letter-spacing: -0.018em; margin-right: var(--nar-b2); }\n.nar-gez
