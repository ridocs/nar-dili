<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nar deneme alanı</title>
<meta name="description" content="Nar'ı kurmadan tarayıcıda dene: yaz, çalıştır, bağlantıyı paylaş.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ===================================================================
   Nar dil rehberi
   Bütün renkler çıplak :root'ta tanımlı; tema blokları yalnız üzerine
   yazar. Böylece hiçbir renk yalnızca bir medya sorgusunun içinde
   yaşamaz — sistem teması "otomatik"teyken de sayfa eksiksiz boyanır.
   =================================================================== */

:root {
  --zemin: #FBF8F8;
  --yuzey: #FFFFFF;
  --yuzey-2: #F7F3F3;
  --kod-zemin: #F6F2F2;
  --cikti-zemin: #F2EFEE;
  --metin: #171110;
  --metin-soluk: #766763;
  --kenar: #E8E1E0;
  --kenar-guclu: #D6CDCB;
  --vurgu: #AC1922;
  --vurgu-uc: #A10E2F;
  --vurgu-metin: #FFFFFF;
  --vurgu-zemin: #FDF2F2;
  --hata: #A4132B;
  --hata-zemin: #FDF1F2;
  --panel-golge: 0 48px 72px -12px #00000008, 0 32px 44px -12px #0000000f;
  --hairline: linear-gradient(90deg, #00000005, #00000026 45%, #00000005);
  --hayalet: #171110;
  --hayalet-opaklik: .045;
  --bar-zemin: #FBF8F8E6;
  color-scheme: light;
  --n-kw: #7A2D8F;
  --n-tip: #1B4FA8;
  --n-metin: #15693A;
  --n-sayi: #9A4A05;
  --n-yorum: #736A65;
  --n-yerlesik: #0B6473;
  --n-fn: #2B2521;
  --n-op: #6F6661;

  /* 21st.dev'in yarıçap merdiveni */
  --radius: .5rem;
  --radius-sm: calc(var(--radius) - 4px);
  --radius-md: calc(var(--radius) - 2px);
  --radius-lg: var(--radius);
  --radius-xl: .75rem;

  --olcu: 72ch;
  --bar: 48px;
  /* Developer Mono eşleşmesi: başlıklar mono, gövde sans. */
  --govde: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system,
           'Helvetica Neue', Arial, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'Cascadia Code', 'SF Mono',
          Consolas, 'Liberation Mono', monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-tema='acik']) {
    --zemin: #0C0808;
    --yuzey: #1C1716;
    --yuzey-2: #251F1E;
    --kod-zemin: #141010;
    --cikti-zemin: #111514;
    --metin: #F8F4F3;
    --metin-soluk: #A29592;
    --kenar: #2C2625;
    --kenar-guclu: #3D3635;
    --vurgu: #F66D67;
    --vurgu-uc: #EC6771;
    --vurgu-metin: #2A0F0E;
    --vurgu-zemin: #241413;
    --hata: #F58A84;
    --hata-zemin: #26100F;
    --panel-golge: 0 12px 24px 0 #ffffff08 inset, 0 .5px .5px 0 #ffffff0f inset, 0 .25px .25px 0 #ffffff1f inset, 0 48px 72px -12px #0000003d, 0 32px 44px -12px #00000052;
    --hairline: linear-gradient(90deg, #ffffff03, #ffffff4d 45%, #ffffff03);
    --hayalet: #F8F4F3;
    --hayalet-opaklik: .035;
    --bar-zemin: #0C0808E6;
    color-scheme: dark;
    --n-kw: #D6A0E8;
    --n-tip: #8FB6F0;
    --n-metin: #84CFA0;
    --n-sayi: #EBA96A;
    --n-yorum: #8B807C;
    --n-yerlesik: #6FC6D6;
    --n-fn: #EDE7E3;
    --n-op: #A29592;
  }
}

:root[data-tema='koyu'] {
  --zemin: #0C0808;
  --yuzey: #1C1716;
  --yuzey-2: #251F1E;
  --kod-zemin: #141010;
  --cikti-zemin: #111514;
  --metin: #F8F4F3;
  --metin-soluk: #A29592;
  --kenar: #2C2625;
  --kenar-guclu: #3D3635;
  --vurgu: #F66D67;
  --vurgu-uc: #EC6771;
  --vurgu-metin: #2A0F0E;
  --vurgu-zemin: #241413;
  --hata: #F58A84;
  --hata-zemin: #26100F;
  --panel-golge: 0 12px 24px 0 #ffffff08 inset, 0 .5px .5px 0 #ffffff0f inset, 0 .25px .25px 0 #ffffff1f inset, 0 48px 72px -12px #0000003d, 0 32px 44px -12px #00000052;
  --hairline: linear-gradient(90deg, #ffffff03, #ffffff4d 45%, #ffffff03);
  --hayalet: #F8F4F3;
  --hayalet-opaklik: .035;
  --bar-zemin: #0C0808E6;
  color-scheme: dark;
  --n-kw: #D6A0E8;
  --n-tip: #8FB6F0;
  --n-metin: #84CFA0;
  --n-sayi: #EBA96A;
  --n-yorum: #8B807C;
  --n-yerlesik: #6FC6D6;
  --n-fn: #EDE7E3;
  --n-op: #A29592;
}

*, *::before, *::after { box-sizing: border-box; }

html { scroll-behavior: smooth; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}

body {
  margin: 0;
  background: var(--zemin);
  color: var(--metin);
  font-family: var(--govde);
  font-size: 16px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

.kok { background: var(--zemin); color: var(--metin); }

a { color: var(--vurgu); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }

:focus-visible {
  outline: 2px solid var(--vurgu);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

.ikon { flex: none; }

/* Kendi kabında kayan her şey ince bir çubuk gösterir; kalın sistem çubuğu
   kod kutusunun içinde bir satır yüksekliği kadar yer kaplıyordu. */
pre, .icindekiler, .ref-sar {
  scrollbar-width: thin;
  scrollbar-color: var(--kenar-guclu) transparent;
}
pre::-webkit-scrollbar, .icindekiler::-webkit-scrollbar,
.ref-sar::-webkit-scrollbar { width: 8px; height: 8px; }
pre::-webkit-scrollbar-thumb, .icindekiler::-webkit-scrollbar-thumb,
.ref-sar::-webkit-scrollbar-thumb {
  background: var(--kenar-guclu); border-radius: 8px;
}
pre::-webkit-scrollbar-track, .icindekiler::-webkit-scrollbar-track,
.ref-sar::-webkit-scrollbar-track { background: transparent; }

/* Ekran okuyucuya görünür, göze görünmez. */
.gizli-metin {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap;
}

.atla {
  position: absolute; left: 8px; top: -60px; z-index: 60;
  background: var(--vurgu); color: var(--vurgu-metin);
  padding: 8px 14px; border-radius: var(--radius); font-size: 14px;
  transition: top .2s ease;
}
.atla:focus { top: 8px; }

/* Ortak genişlik: her bölüm aynı ızgaraya oturur. */
.sinir {
  max-width: 1200px; margin: 0 auto;
  padding-inline: 24px;
}

/* ------------------------------------------------------------- üst bar */

.bar {
  position: sticky; top: 0; z-index: 40;
  height: var(--bar);
  display: flex; align-items: center; gap: 16px;
  padding: 0 20px;
  background: var(--bar-zemin);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--kenar);
}

.bar-marka {
  display: flex; align-items: baseline; gap: 8px;
  font-family: var(--mono); font-weight: 500; font-size: 14px;
  letter-spacing: -.02em;
  color: var(--metin); text-decoration: none;
}
.bar-marka b { color: var(--vurgu); font-weight: 500; }
.bar-marka .surum {
  font-size: 11px; font-weight: 400;
  color: var(--metin-soluk); font-variant-numeric: tabular-nums;
}

.ara-sar {
  position: relative;
  flex: 1 1 auto; max-width: 420px; margin: 0 auto;
  display: flex; align-items: center;
}
.ara-sar .ikon {
  position: absolute; left: 10px; color: var(--metin-soluk); pointer-events: none;
}
#ara {
  width: 100%; height: 30px;
  padding: 0 52px 0 32px;
  font: inherit; font-size: 13px;
  color: var(--metin);
  background: var(--yuzey-2);
  border: 1px solid var(--kenar);
  border-radius: var(--radius-md);
  transition: border-color .2s ease, background .2s ease;
}
#ara::placeholder { color: var(--metin-soluk); }
#ara:focus { outline: none; border-color: var(--kenar-guclu); }
#ara:focus-visible { outline: 2px solid var(--vurgu); outline-offset: 1px; }

kbd {
  font-family: var(--mono); font-size: 10px; line-height: 1;
  padding: 3px 5px; border-radius: var(--radius-sm);
  color: var(--metin-soluk);
  background: var(--zemin);
  border: 1px solid var(--kenar);
}
.ara-sar kbd { position: absolute; right: 8px; pointer-events: none; }

.bar-sag { display: flex; align-items: center; gap: 2px; margin-left: auto; }

.bar-dugme {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 30px; min-width: 30px; padding: 0 9px;
  color: var(--metin-soluk);
  background: none; border: 1px solid transparent;
  border-radius: var(--radius-md);
  font: inherit; font-size: 13px; cursor: pointer;
  text-decoration: none;
  transition: background .2s ease, color .2s ease, border-color .2s ease;
}
.bar-dugme:hover {
  color: var(--metin); background: var(--yuzey-2); border-color: var(--kenar);
}
.bar-dugme .ay { display: none; }
:root[data-tema='koyu'] .bar-dugme .ay { display: block; }
:root[data-tema='koyu'] .bar-dugme .gunes { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-tema='acik']) .bar-dugme .ay { display: block; }
  :root:not([data-tema='acik']) .bar-dugme .gunes { display: none; }
  :root[data-tema='acik'] .bar-dugme .ay { display: none; }
  :root[data-tema='acik'] .bar-dugme .gunes { display: block; }
}

/* ---------------------------------------------------------------- giriş */

.giris-alani { position: relative; overflow: hidden; }
.giris-alani::before {
  content: ''; position: absolute; inset: -30% -10% auto -10%; height: 70%;
  background: radial-gradient(50% 60% at 30% 40%,
              var(--vurgu-zemin), transparent 70%);
  pointer-events: none;
}

.giris-ic {
  position: relative;
  padding-block: 64px 56px;
  display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
  gap: 56px; align-items: center;
}

.eyebrow {
  display: flex; align-items: center; gap: 8px;
  margin: 0 0 16px;
  font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--metin-soluk);
}
.eyebrow .nokta {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--vurgu);
}

.giris h1 {
  margin: 0 0 18px;
  font-family: var(--mono); font-weight: 500;
  font-size: clamp(27px, 3.2vw, 38px);
  line-height: 1.2; letter-spacing: -.035em;
  text-wrap: balance;
}

.giris-ozet {
  margin: 0 0 24px; max-width: 48ch;
  font-size: 16.5px; color: var(--metin-soluk);
}
.giris-ozet strong { color: var(--metin); font-weight: 600; }
.giris-ozet p { margin: 0; }

.eylemler { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 28px; }

/* Tek canlı renk yalnız burada: birincil eylem. */
.cta {
  display: inline-flex; align-items: center; gap: 8px;
  height: 38px; padding: 0 18px;
  border-radius: 999px;
  background: linear-gradient(180deg, var(--vurgu), var(--vurgu-uc));
  color: var(--vurgu-metin);
  font-size: 14px; font-weight: 500; text-decoration: none;
  box-shadow: 0 1px 0 0 #ffffff2e inset;
  transition: transform .2s ease, filter .2s ease;
}
.cta:hover { filter: brightness(1.06); transform: translateY(-1px); }
.cta .ikon { transition: transform .2s ease; }
.cta:hover .ikon { transform: translateX(2px); }

.cta-ikincil {
  display: inline-flex; align-items: center; gap: 8px;
  height: 38px; padding: 0 16px;
  border-radius: 999px;
  color: var(--metin); text-decoration: none;
  background: var(--yuzey-2); border: 1px solid var(--kenar);
  font-size: 14px;
  transition: border-color .2s ease, background .2s ease;
}
.cta-ikincil:hover { border-color: var(--kenar-guclu); }

.giris-not {
  margin: -18px 0 24px; max-width: 46ch;
  font-size: 13px; color: var(--metin-soluk);
}

.hedefler {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin: 0; padding: 0; list-style: none;
}
.hedefler li {
  font-family: var(--mono); font-size: 11px; letter-spacing: .02em;
  padding: 3px 9px; border-radius: 999px;
  color: var(--metin-soluk);
  background: var(--yuzey-2); border: 1px solid var(--kenar);
}

/* Yüzen panel — 21st'in imza detayı: dev yumuşak gölge, beyaz inset
   hairline, üst kenarda gradyanlı saç çizgisi. */
.panel {
  position: relative;
  border: 1px solid var(--kenar);
  border-radius: var(--radius-xl);
  background: var(--yuzey);
  box-shadow: var(--panel-golge);
  overflow: hidden;
}
.panel::before {
  content: ''; position: absolute; inset: 0 0 auto; height: 1px;
  background: var(--hairline);
  z-index: 1;
}
.panel .kod-kutu, .panel .cikti {
  margin: 0; border: none; border-radius: 0; box-shadow: none;
}
.panel .cikti { border-top: 1px solid var(--kenar); }

/* -------------------------------------------------------- bölüm dizini */

.dizin-alani {
  border-top: 1px solid var(--kenar);
  border-bottom: 1px solid var(--kenar);
  background: var(--yuzey);
}
.dizin-ic { padding-block: 28px 32px; }

.dizin-basi {
  display: flex; align-items: baseline; gap: 12px;
  margin-bottom: 18px;
}
.dizin-basi h2 {
  margin: 0; font-family: var(--mono); font-size: 13px; font-weight: 500;
  letter-spacing: -.01em;
}
.dizin-basi p { margin: 0; font-size: 12px; color: var(--metin-soluk); }
.dizin-basi .sag {
  margin-left: auto; font-size: 12px; color: var(--metin-soluk);
  text-decoration: none;
}
.dizin-basi .sag:hover { color: var(--vurgu); }

/* Yoğun çok sütunlu kategori listesi: kalın küçük etiket, minik çizgi
   ikon, sağa yaslı mono sayaç. */
.dizin {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 1px 24px;
  margin: 0; padding: 0; list-style: none;
}
.dizin a {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 8px; margin-inline: -8px;
  border-radius: var(--radius-md);
  color: var(--metin); text-decoration: none;
  font-size: 12.5px; font-weight: 500;
  transition: background .2s ease, color .2s ease;
}
.dizin a .ikon { color: var(--metin-soluk); }
.dizin a .ad { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dizin a .adet {
  margin-left: auto;
  font-family: var(--mono); font-size: 11px; font-weight: 400;
  color: var(--metin-soluk); font-variant-numeric: tabular-nums;
}
.dizin a:hover { background: var(--yuzey-2); }
.dizin a:hover .ikon { color: var(--vurgu); }

/* ------------------------------------------------------------ kod kutusu */

.kod-kutu {
  margin: 0 0 14px;
  background: var(--kod-zemin);
  border: 1px solid var(--kenar);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.kod-basi {
  display: flex; align-items: center; gap: 8px;
  padding: 0 8px 0 12px; height: 34px;
  background: var(--yuzey-2);
  border-bottom: 1px solid var(--kenar);
}
.kod-dil {
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--metin-soluk);
}

/* Kod kutusunun sağ üstündeki eylemler. */
.kod-eylem { margin-left: auto; display: flex; align-items: center; gap: 2px; }

.dene {
  display: inline-flex; align-items: center; gap: 5px;
  height: 24px; padding: 0 8px;
  font-family: var(--mono); font-size: 11px;
  color: var(--vurgu); text-decoration: none;
  border: 1px solid transparent; border-radius: var(--radius-sm);
  transition: background .2s ease, border-color .2s ease;
}
.dene:hover { background: var(--vurgu-zemin); border-color: var(--kenar); }
.dene .ikon { width: 12px; height: 12px; }

.kopyala {
  display: inline-flex; align-items: center; gap: 5px;
  height: 24px; padding: 0 8px;
  font-family: var(--mono); font-size: 11px;
  color: var(--metin-soluk);
  background: none; border: 1px solid transparent;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background .2s ease, color .2s ease, border-color .2s ease;
}
.kopyala:hover {
  color: var(--metin); background: var(--zemin); border-color: var(--kenar);
}
.kopyala .onay { display: none; }
.kopyala.bitti { color: var(--vurgu); }
.kopyala.bitti .onay { display: block; }
.kopyala.bitti .kopya { display: none; }

pre.kod {
  margin: 0; padding: 14px 16px;
  overflow-x: auto;
  font-family: var(--mono); font-size: 13px; line-height: 1.7;
  tab-size: 2;
}
pre.kod code { font: inherit; }

.n-kw { color: var(--n-kw); }
.n-tip { color: var(--n-tip); }
.n-metin { color: var(--n-metin); }
.n-sayi { color: var(--n-sayi); }
.n-yorum { color: var(--n-yorum); }
.n-yerlesik { color: var(--n-yerlesik); }
.n-fn { color: var(--n-fn); }
.n-op { color: var(--n-op); }

/* ------------------------------------------------------------------ çıktı */

.cikti {
  margin: -14px 0 18px;
  border: 1px solid var(--kenar); border-top: none;
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  background: var(--cikti-zemin);
}
.cikti-etiket {
  display: block; padding: 8px 16px 0;
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--metin-soluk);
}
.cikti pre {
  margin: 0; padding: 4px 16px 14px;
  overflow-x: auto;
  font-family: var(--mono); font-size: 12.5px; line-height: 1.6;
  color: var(--metin);
}
.cikti.hatali {
  background: var(--hata-zemin); border-color: var(--hata);
}
.cikti.hatali .cikti-etiket, .cikti.hatali pre { color: var(--hata); }

/* Kod kutusunun altına çıktı geliyorsa alt köşeleri düzleşir. */
.kod-kutu:has(+ .cikti) {
  border-bottom-left-radius: 0; border-bottom-right-radius: 0;
}

/* ---------------------------------------------------------------- kabuk */

.kabuk {
  display: grid;
  grid-template-columns: 236px minmax(0, 1fr);
  gap: 56px;
  padding-block: 40px 80px;
}

/* ------------------------------------------------------------ içindekiler */

.icindekiler {
  position: sticky; top: calc(var(--bar) + 16px);
  align-self: start;
  max-height: calc(100vh - var(--bar) - 32px);
  overflow-y: auto;
  padding-right: 8px;
  font-size: 13px;
}
.icindekiler summary {
  display: none;
  font-family: var(--mono); font-size: 13px;
  font-weight: 500; cursor: pointer; padding: 8px 0;
}

.ic-grup { margin-bottom: 18px; }
.ic-baslik {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 6px;
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--metin-soluk);
}
.ic-baslik .sayi {
  margin-left: auto; font-variant-numeric: tabular-nums; opacity: .75;
}
.ic-grup ul { margin: 0; padding: 0; list-style: none; }
.ic-grup li { margin: 0; }
.ic-grup a {
  display: block; padding: 3px 10px;
  margin-left: -10px;
  color: var(--metin-soluk); text-decoration: none;
  border-left: 2px solid transparent;
  border-radius: 0 var(--radius-md) var(--radius-md) 0;
  transition: color .2s ease, background .2s ease;
}
.ic-grup a:hover { color: var(--metin); background: var(--yuzey-2); }
.ic-grup a.etkin {
  color: var(--vurgu); border-left-color: var(--vurgu);
  background: var(--vurgu-zemin); font-weight: 500;
}
.ic-grup[hidden] { display: none; }

.ara-bos { padding: 8px 0; color: var(--metin-soluk); font-size: 13px; }

/* --------------------------------------------------------------- içerik */

.icerik { min-width: 0; max-width: var(--olcu); }

.bolum {
  position: relative;
  margin-bottom: 64px;

<script>// Nar çalışma zamanı — JavaScript arka ucu.
// Üretilen kodun başına gömülür. Tüm isimler `$` ile başlar; Nar
// tanımlayıcıları `$` içeremediği için çakışma olamaz.

"use strict";

class NarPanic extends Error {
  constructor(message) {
    super(message);
    this.name = "NarPanic";
  }
}

function $panic(message) {
  throw new NarPanic(message);
}

// --- eşitlik ---------------------------------------------------------------
function $eq(a, b) {
  if (a === b) return true;
  if (a === null || b === null || a === undefined || b === undefined) {
    return (a === null || a === undefined) && (b === null || b === undefined);
  }
  if (typeof a !== "object" || typeof b !== "object") return false;

  if (Array.isArray(a)) {
    if (!Array.isArray(b) || a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) if (!$eq(a[i], b[i])) return false;
    return true;
  }
  if (a instanceof Map) {
    if (!(b instanceof Map) || a.size !== b.size) return false;
    for (const [k, v] of a) {
      if (!b.has(k) || !$eq(v, b.get(k))) return false;
    }
    return true;
  }
  if (a.$tag !== undefined || b.$tag !== undefined) {
    if (a.$tag !== b.$tag) return false;
    return $eq(a.$values, b.$values);
  }
  if (a.constructor !== b.constructor) return false;
  const keys = Object.keys(a);
  if (keys.length !== Object.keys(b).length) return false;
  for (const k of keys) if (!$eq(a[k], b[k])) return false;
  return true;
}

// --- uzunluk ve dizinleme --------------------------------------------------
function $len(v) {
  if (v === null || v === undefined) $panic("'none' üzerinde len çağrıldı");
  if (typeof v === "string") return $karakterDizisi(v).length;
  if (Array.isArray(v)) return v.length;
  if (v instanceof Map) return v.size;
  $panic("len bu değer üzerinde tanımlı değil");
}

// Metinler kod noktası bazlı dizinlenir (emoji, birleşik karakterler doğru
// sayılsın diye). Her erişimde diziye çevirmek uzun metinlerde O(n²) yapardı;
// bu yüzden uzun metinlerin karakter dizisi küçük bir önbellekte tutulur.
const $DIZI_ONBELLEK = new Map();

const $ONBELLEK_ESIGI = 64;

const $ONBELLEK_BOYU = 4;

function $karakterDizisi(s) {
  if (s.length < $ONBELLEK_ESIGI) return Array.from(s);
  let dizi = $DIZI_ONBELLEK.get(s);
  if (dizi === undefined) {
    dizi = Array.from(s);
    if ($DIZI_ONBELLEK.size >= $ONBELLEK_BOYU) {
      $DIZI_ONBELLEK.delete($DIZI_ONBELLEK.keys().next().value);
    }
    $DIZI_ONBELLEK.set(s, dizi);
  }
  return dizi;
}

function $strGet(s, i) {
  const chars = $karakterDizisi(s);
  if (i < 0 || i >= chars.length) {
    $panic("metin sınırı aşıldı: dizin " + i + ", uzunluk " + chars.length);
  }
  return chars[i];
}

function $listIndexOf(list, x) {
  for (let i = 0; i < list.length; i++) if ($eq(list[i], x)) return i;
  return -1;
}

function $listContains(list, x) {
  return $listIndexOf(list, x) !== -1;
}

// --- metin metotları -------------------------------------------------------
function $strSlice(s, a, b) {
  return $karakterDizisi(s).slice(a, b).join("");
}

// ------------------------------------------------------------------
// Nar kaynağından üretildi — elle düzenlemeyin.
// ------------------------------------------------------------------

function harfMi(c) {
  if (($len(c) === 0)) {
    return false;
  }
  return ((KUCUK.includes(c) || BUYUK.includes(c)) || (c === "_"));
}

function rakamMi(c) {
  if (($len(c) === 0)) {
    return false;
  }
  return RAKAM.includes(c);
}

function adKarakteriMi(c) {
  return (harfMi(c) || rakamMi(c));
}

function buyukHarfMi(c) {
  if (($len(c) === 0)) {
    return false;
  }
  return BUYUK.includes(c);
}

function bosluktanMi(c) {
  if (($len(c) === 0)) {
    return false;
  }
  return BOSLUK.includes(c);
}

function karakter(kaynak, i) {
  if (((i < 0) || (i >= $len(kaynak)))) {
    return "";
  }
  return $strGet(kaynak, i);
}

function satirYorumuSonu(kaynak, bas) {
  let i = bas;
  const n = $len(kaynak);
  while (((i < n) && (karakter(kaynak, i) !== "\n"))) {
    i = (i + 1);
  }
  return i;
}

function blokYorumuSonu(kaynak, bas) {
  const n = $len(kaynak);
  let i = (bas + 2);
  let derinlik = 1;
  while (((i < n) && (derinlik > 0))) {
    const c = karakter(kaynak, i);
    const d = karakter(kaynak, (i + 1));
    if (((c === "/") && (d === "*"))) {
      derinlik = (derinlik + 1);
      i = (i + 2);
    } else {
      if (((c === "*") && (d === "/"))) {
        derinlik = (derinlik - 1);
        i = (i + 2);
      } else {

      }
    }

  return i;
}

function metinSonu(kaynak, bas) {
  const n = $len(kaynak);
  let i = (bas + 1);
  while ((i < n)) {
    const c = karakter(kaynak, i);
    if ((c === "\\")) {
      i = (i + 2);
      continue;
    }
    if ((c === "\"")) {
      return (i + 1);
    }
    if ((c === "\n")) {
      return i;
    }
    i = (i + 1);
  }
  return i;
}

function sayiSonu(kaynak, bas) {
  const n = $len(kaynak);
  let i = bas;
  let noktaVar = false;
  while ((i < n)) {
    const c = karakter(kaynak, i);
    if ((rakamMi(c) || (c === "_"))) {
      i = (i + 1);
      continue;
    }
    if ((((c === ".") && (!noktaVar)) && rakamMi(karakter(kaynak, (i + 1))))) {
      noktaVar = true;
      i = (i + 1);
      continue;
    }
    if ((harfMi(c) && (i > bas))) {
      i = (i + 1);
      continue;
    }
    return i;
  }
  return i;
}

function kelimeSonu(kaynak, bas) {
  const n = $len(kaynak);
  let i = bas;
  while (((i < n) && adKarakteriMi(karakter(kaynak, i)))) {
    i = (i + 1);
  }
  return i;
}

function kelimeSinifi(kelime, sonrasi) {
  if ($listContains(ANAHTAR, kelime)) {
    return "n-kw";
  }
  if ($listContains(TIP_ADI, kelime)) {
    return "n-tip";
  }
  if ($listContains(YERLESIK, kelime)) {
    return "n-yerlesik";
  }
  if (sonrasi.trim().startsWith("(")) {
    return "n-fn";
  }
  if (buyukHarfMi($strGet(kelime, 0))) {

  }
  return "";
}

function kacir(s) {
  let sonuc = s.split("&").join("&amp;");
  sonuc = sonuc.split("<").join("&lt;");
  sonuc = sonuc.split(">").join("&gt;");
  return sonuc;
}

function sar(sinif, metin) {
  if (($len(sinif) === 0)) {
    return kacir(metin);
  }
  return `<span class="${sinif}">${kacir(metin)}</span>`;
}

function renklendir(kaynak) {
  let sonuc = "";
  let i = 0;
  const n = $len(kaynak);
  while ((i < n)) {
    const c = karakter(kaynak, i);
    const d = karakter(kaynak, (i + 1));
    if (((c === "/") && (d === "/"))) {
      const son = satirYorumuSonu(kaynak, i);
      sonuc = sonuc + sar("n-yorum", $strSlice(kaynak, i, son));
      i = son;
      continue;
    }
    if (((c === "/") && (d === "*"))) {
      const son = blokYorumuSonu(kaynak, i);
      sonuc = sonuc + sar("n-yorum", $strSlice(kaynak, i, son));
      i = son;
      continue;
    }
    if ((c === "\"")) {
      const son = metinSonu(kaynak, i);
      sonuc = sonuc + sar("n-metin", $strSlice(kaynak, i, son));
      i = son;
      continue;
    }
    if (rakamMi(c)) {
      const son = sayiSonu(kaynak, i);
      sonuc = sonuc + sar("n-sayi", $strSlice(kaynak, i, son));
      i = son;
      continue;
    }
    if (harfMi(c)) {
      const son = kelimeSonu(kaynak, i);
      const kelime = $strSlice(kaynak, i, son);
      const bakis = $strSlice(kaynak, son, Math.min((son + 4), n));
      sonuc = sonuc + sar(kelimeSinifi(kelime, bakis), kelime);
      i = son;
      continue;
    }
    if (bosluktanMi(c)) {
      sonuc = sonuc + kacir(c);
      i = (i + 1);
      continue;
    }
    sonuc = sonuc + sar("n-op", c);
    i = (i + 1);
  }
  return sonuc;
}

<script>
(function () {
  'use strict';

  // --- tema ---------------------------------------------------------
  // Seçim kökte bir öznitelik olarak durur; CSS onu hem sistem temasının
  // hem de varsayılanın üstüne yazar. Seçim yoksa sistem izlenir.
  var kok = document.documentElement;
  var ANAHTAR = 'nar-tema';
  try {
    var kayitli = localStorage.getItem(ANAHTAR);
    if (kayitli === 'acik' || kayitli === 'koyu') kok.setAttribute('data-tema', kayitli);
  } catch (e) { /* gizli sekmede depolama kapalı olabilir */ }

  function koyuMu() {
    var secim = kok.getAttribute('data-tema');
    if (secim) return secim === 'koyu';
    return window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  var temaDugmesi = document.getElementById('tema');
  if (temaDugmesi) {
    var etiketle = function () {
      var koyu = koyuMu();
      temaDugmesi.setAttribute('aria-pressed', koyu ? 'true' : 'false');
      temaDugmesi.title = koyu ? 'Açık temaya geç' : 'Koyu temaya geç';
    };
    etiketle();
    temaDugmesi.addEventListener('click', function () {
      var yeni = koyuMu() ? 'acik' : 'koyu';
      kok.setAttribute('data-tema', yeni);
      try { localStorage.setItem(ANAHTAR, yeni); } catch (e) {}
      etiketle();
    });
  }

  // --- kopyala ------------------------------------------------------
  document.querySelectorAll('.kopyala').forEach(function (dugme) {
    dugme.addEventListener('click', function () {
      var kutu = dugme.closest('.kod-kutu');
      var kod = kutu ? kutu.querySelector('pre.kod').textContent : '';
      var bitir = function (basarili) {
        dugme.classList.toggle('bitti', basarili);
        dugme.querySelector('.yazi').textContent = basarili ? 'kopyalandı' : 'olmadı';
        setTimeout(function () {
          dugme.classList.remove('bitti');
          dugme.querySelector('.yazi').textContent = 'kopyala';
        }, 1400);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(kod).then(function () { bitir(true); },
                                                function () { bitir(false); });
      } else {
        bitir(false);
      }
    });
  });

  // --- içindekiler dar ekranda katlanır ------------------------------
  var katla = document.querySelector('.ic-katla');
  if (katla) {
    var dar = window.matchMedia('(max-width: 900px)');
    var elle = false;
    katla.addEventListener('toggle', function () { elle = true; });
    var ayarla = function () { if (!elle) katla.open = !dar.matches; };
    ayarla();
    dar.addEventListener('change', function () { elle = false; ayarla(); });
  }

  // --- arama --------------------------------------------------------
  // İçindekileri yerinde süzer: eşleşmeyen konular gizlenir, boşalan
  // bölüm başlığı da gizlenir. Sayfanın kendisine dokunulmaz.
  var ara = document.getElementById('ara');
  var bos = document.querySelector('.ara-bos');
  if (ara) {
    var gruplar = Array.prototype.map.call(
      document.querySelectorAll('.ic-grup'), function (g) {
        var sayi = g.querySelector('.sayi');
        return {
          oge: g,
          sayi: sayi,
          // Süzme sırasında sayaç görüneni gösterir; toplamı göstermeye
          // devam etseydi ekrandaki listeyle çelişirdi.
          toplam: sayi ? sayi.textContent : '',
          bagalar: Array.prototype.map.call(g.querySelectorAll('a'), function (a) {
            return { oge: a.parentNode, metin: a.textContent.toLocaleLowerCase('tr') };
          })
        };
      });

    var suz = function () {
      var q = ara.value.trim().toLocaleLowerCase('tr');
      var bulunan = 0;
      gruplar.forEach(function (g) {
        var acik = 0;
        g.bagalar.forEach(function (b) {
          var uyar = !q || b.metin.indexOf(q) !== -1;
          b.oge.hidden = !uyar;
          if (uyar) acik += 1;
        });
        g.oge.hidden = acik === 0;
        if (g.sayi) g.sayi.textContent = q ? String(acik) : g.toplam;
        bulunan += acik;
      });
      if (bos) bos.hidden = bulunan !== 0;
    };

    ara.addEventListener('input', suz);
    ara.addEventListener('keydown', function (o) {
      if (o.key === 'Escape') { ara.value = ''; suz(); ara.blur(); }
    });

    document.addEventListener('keydown', function (o) {
      var k = o.key === 'k' || o.key === 'K';
      if (k && (o.metaKey || o.ctrlKey)) { o.preventDefault(); ara.focus(); ara.select(); }
    });
  }

  // --- etkin konu ---------------------------------------------------
  // Görünen konuyu içindekilerde işaretler. Kaydırma olayı dinlemek
  // yerine gözlemci: her karede hesap yapmaz.
  var baglar = {};
  document.querySelectorAll('.ic-grup a').forEach(function (a) {
    var hedef = a.getAttribute('href');
    if (hedef && hedef.charAt(0) === '#') baglar[hedef.slice(1)] = a;
  });

  var etkin = null;
  var isaretle = function (kimlik) {
    var a = baglar[kimlik];
    if (!a || a === etkin) return;
    if (etkin) etkin.classList.remove('etkin');
    a.classList.add('etkin');
    etkin = a;
  };

  if ('IntersectionObserver' in window) {
    var gorunen = new Set();
    var gozlemci = new IntersectionObserver(function (girdiler) {
      girdiler.forEach(function (g) {
        if (g.isIntersecting) gorunen.add(g.target.id);
        else gorunen.delete(g.target.id);
      });
      // En yukarıdaki görünen konu etkin sayılır.
      var ilk = null, enUst = Infinity;
      gorunen.forEach(function (kimlik) {
        var o = document.getElementById(kimlik);
        if (!o) return;
        var ust = o.getBoundingClientRect().top;
        if (ust < enUst) { enUst = ust; ilk = kimlik; }
      });
      if (ilk) isaretle(ilk);
    }, { rootMargin: '-56px 0px -60% 0px' });

    document.querySelectorAll('.konu, #referans').forEach(function (o) {
      gozlemci.observe(o);
    });
  }
})();
</script>
<script>
(function () {
  'use strict';

  var kaynak = document.getElementById('kaynak');
  var boya = document.getElementById('boya');
  var cikti = document.getElementById('cikti');
  var ekran = document.getElementById('ekran');
  var calistirDugmesi = document.getElementById('calistir');
  var durum = document.getElementById('durum');
  var durumYazi = document.getElementById('durum-yazi');

  // --- boyama ------------------------------------------------------
  // Renklendirici Nar ile yazılmıştır; IDE ve belgeler sitesiyle aynı
  // kaynaktan gelir, o yüzden üçü arasında sessizce fark oluşamaz.
  function boya_() {
    var metin = kaynak.value;
    // Son satır boşsa <pre> onu yutar; imleç son satıra inince boya
    // kayar. Sona bir boşluk eklemek hizayı korur.
    boya.innerHTML = globalThis.Nar.renklendir(metin + '\n');
  }

  kaynak.addEventListener('input', boya_);
  kaynak.addEventListener('scroll', function () {
    boya.parentNode.scrollTop = kaynak.scrollTop;
  });

  // Sekme tuşu odağı kaçırmasın: iki boşluk yazar.
  kaynak.addEventListener('keydown', function (o) {
    if (o.key === 'Tab') {
      o.preventDefault();
      var b = kaynak.selectionStart, s = kaynak.selectionEnd;
      kaynak.value = kaynak.value.slice(0, b) + '  ' + kaynak.value.slice(s);
      kaynak.selectionStart = kaynak.selectionEnd = b + 2;
      boya_();
    }
    if ((o.ctrlKey || o.metaKey) && o.key === 'Enter') {
      o.preventDefault();
      calistir();
    }
  });

  // --- çıktı -------------------------------------------------------
  function yaz(metin, sinif) {
    var s = document.createElement('span');
    if (sinif) s.className = sinif;
    s.textContent = metin + '\n';
    cikti.appendChild(s);
  }
  function temizle() { cikti.textContent = ''; }

  function durumYaz(metin, sinif) {
    durumYazi.textContent = metin;
    durum.className = 'durum' + (sinif ? ' ' + sinif : '');
  }

  // --- sekmeler ----------------------------------------------------
  var sekmeler = Array.prototype.slice.call(document.querySelectorAll('.sekme'));
  function sekmeSec(ad) {
    sekmeler.forEach(function (s) {
      var secili = s.dataset.pano === ad;
      s.setAttribute('aria-selected', secili ? 'true' : 'false');
      document.getElementById(s.dataset.pano).hidden = !secili;
    });
  }
  sekmeler.forEach(function (s) {
    s.addEventListener('click', function () { sekmeSec(s.dataset.pano); });
  });

  // --- derleyici ---------------------------------------------------
  // Pyodide ancak ilk çalıştırmada indirilir: sayfayı okumaya gelen
  // kimse 9 MB ödemesin.
  var pyodide = null;
  var yukleniyor = null;

  function derleyiciyiHazirla() {
    if (pyodide) return Promise.resolve(pyodide);
    if (yukleniyor) return yukleniyor;

    durumYaz('derleyici indiriliyor…', 'calisiyor');
    yukleniyor = new Promise(function (coz, kir) {
      var s = document.createElement('script');
      s.src = PYODIDE_URL + 'pyodide.js';
      s.onload = coz;
      s.onerror = function () { kir(new Error('Pyodide yüklenemedi')); };
      document.head.appendChild(s);
    }).then(function () {
      return loadPyodide({ indexURL: PYODIDE_URL });
    }).then(function (py) {
      durumYaz('derleyici açılıyor…', 'calisiyor');
      return fetch('narc.zip').then(function (y) {
        if (!y.ok) throw new Error('narc.zip alınamadı');
        return y.arrayBuffer();
      }).then(function (paket) {
        py.unpackArchive(paket, 'zip');
        py.runPython(HAZIRLIK);
        pyodide = py;
        durumYaz('derleyici hazır', 'hazir');
        return py;
      });
    }).catch(function (h) {
      yukleniyor = null;
      durumYaz('derleyici yüklenemedi', '');
      throw h;
    });
    return yukleniyor;
  }

  // --- çalıştırma --------------------------------------------------
  var calisiyorMu = false;

  function calistir() {
    if (calisiyorMu) return;
    calisiyorMu = true;
    calistirDugmesi.disabled = true;
    temizle();
    yaz('derleniyor…', 'bilgi');

    derleyiciyiHazirla().then(function (py) {
      temizle();
      durumYaz('derleniyor…', 'calisiyor');
      var baslangic = performance.now();
      var sonuc = JSON.parse(py.runPython(
        'derle(' + JSON.stringify(kaynak.value) + ')'));
      var sure = Math.round(performance.now() - baslangic);

      if (!sonuc.tamam) {
        yaz(sonuc.hata, 'hata');
        durumYaz('derleme hatası', '');
        sekmeSec('pano-cikti');
        return;
      }
      durumYaz('derlendi · ' + sure + ' ms', 'hazir');
      programiCalistir(sonuc.kod);
    }).catch(function (h) {
      temizle();
      yaz('Derleyici çalıştırılamadı: ' + h.message, 'hata');
    }).then(function () {
      calisiyorMu = false;
      calistirDugmesi.disabled = false;
    });
  }

  // Kullanıcı kodu ayrı kökenli bir iframe'de çalışır: sayfaya, çerezlere
  // ve depolamaya erişemez. Çıktı postMessage ile geri gelir.
  var ciziliMi = false;

  function programiCalistir(kod) {
    ciziliMi = false;
    var belge =
      '<!doctype html><html lang="tr"><head><meta charset="utf-8">' +
      '<style>' + EKRAN_STILI + '</style></head><body>' +
      '<div id="uygulama"></div><script>' + KOPRU + '<\/script>' +
      '<script>' + kod + '<\/script>' +
      '<script>parent.postMessage({t:"bitti",cizdi:' +
      'document.getElementById("uygulama").childNodes.length>0},"*");<\/script>' +
      '</body></html>';
    ekran.srcdoc = belge;
  }

  window.addEventListener('message', function (o) {
    var v = o.data;
    if (!v || typeof v !== 'object') return;
    if (v.t === 'log') yaz(v.s);
    else if (v.t === 'hata') { yaz(v.s, 'hata'); durumYaz('çalışma hatası', ''); }
    else if (v.t === 'bitti') {
      ciziliMi = v.cizdi;
      if (ciziliMi) sekmeSec('pano-ekran');
      else sekmeSec('pano-cikti');
    }
  });

  // --- paylaşma ----------------------------------------------------
  function sar(metin) {
    var baytlar = new TextEncoder().encode(metin);
    var ikilik = '';
    baytlar.forEach(function (b) { ikilik += String.fromCharCode(b); });
    return btoa(ikilik).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function coz(metin) {
    var d = metin.replace(/-/g, '+').replace(/_/g, '/');
    var ikilik = atob(d);
    var baytlar = new Uint8Array(ikilik.length);
    for (var i = 0; i < ikilik.length; i++) baytlar[i] = ikilik.charCodeAt(i);
    return new TextDecoder().decode(baytlar);
  }

  var paylasDugmesi = document.getElementById('paylas');
  paylasDugmesi.addEventListener('click', function () {
    var adres = location.origin + location.pathname + '#k=' + sar(kaynak.value);
    history.replaceState(null, '', '#k=' + sar(kaynak.value));
    var bitir = function (oldu) {
      paylasDugmesi.classList.toggle('bitti', oldu);
      paylasDugmesi.querySelector('.yazi').textContent =
        oldu ? 'kopyalandı' : 'olmadı';
      setTimeout(function () {
        paylasDugmesi.classList.remove('bitti');
        paylasDugmesi.querySelector('.yazi').textContent = 'Paylaş';
      }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(adres).then(function () { bitir(true); },
                                                function () { bitir(false); });
    } else { bitir(false); }
  });

  // --- örnekler ----------------------------------------------------
  var secici = document.getElementById('ornek');
  secici.addEventListener('change', function () {
    if (!secici.value) return;
    kaynak.value = ORNEKLER[+secici.value];
    boya_();
    history.replaceState(null, '', location.pathname);
  });

  // --- açılış ------------------------------------------------------
  var basla = ORNEKLER[0];
  if (location.hash.indexOf('#k=') === 0) {
    try { basla = coz(location.hash.slice(3)); } catch (e) { /* bozuk bağlantı */ }
  }
  kaynak.value = basla;
  boya_();
  durumYaz('derleyici ilk çalıştırmada inecek', '');

  calistirDugmesi.addEventListener('click', calistir);
})();
</script>
</body>
</html>
