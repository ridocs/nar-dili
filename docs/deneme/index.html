<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nar deneme alanı</title>
<meta name="description" content="Nar'ı kurmadan tarayıcıda dene: IDE, derleyici ve çalıştırma tarayıcında.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Renkler belgeler sitesiyle aynı paletten; iki tema da ölçülmüş. */
:root {
  --zemin: #FBF8F8;
  --yuzey: #FFFFFF;
  --yuzey-2: #F7F3F3;
  --kod-zemin: #FCFAFA;
  --panel: #F4F1F0;
  --metin: #171110;
  --metin-soluk: #766763;
  --kenar: #E8E1E0;
  --kenar-guclu: #D6CDCB;
  --vurgu: #AC1922;
  --vurgu-zemin: #FDF2F2;
  --vurgu-metin: #FFFFFF;
  --hata: #A4132B;
  --hata-zemin: #FDF1F2;
  --uyari: #8A5A00;
  --uyari-zemin: #FDF6E8;
  --iyi: #2F7A4F;
  --iyi-zemin: #EFF7F2;
  --oluk: #A89E97;
  --n-kw: #7A2D8F; --n-tip: #1B4FA8; --n-metin: #15693A; --n-sayi: #9A4A05;
  --n-yorum: #736A65; --n-yerlesik: #0B6473; --n-fn: #2B2521; --n-op: #6F6661;
  --tek: 'JetBrains Mono', ui-monospace, "Cascadia Code", Consolas, monospace;
  --govde: 'IBM Plex Sans', "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  --kod-boy: 13.5px;
  --kod-satir: 21px;
  --agac-genislik: 232px;
  color-scheme: light;
}
:root[data-tema='koyu'] {
  --zemin: #0C0808;
  --yuzey: #1C1716;
  --yuzey-2: #251F1E;
  --kod-zemin: #141010;
  --panel: #111514;
  --metin: #F8F4F3;
  --metin-soluk: #A29592;
  --kenar: #2C2625;
  --kenar-guclu: #3D3635;
  --vurgu: #F66D67;
  --vurgu-zemin: #241413;
  --vurgu-metin: #2A0F0E;
  --hata: #F58A84;
  --hata-zemin: #26100F;
  --uyari: #D7A64A;
  --uyari-zemin: #2A2418;
  --iyi: #6FC395;
  --iyi-zemin: #1B2620;
  --oluk: #6E645F;
  --n-kw: #D6A0E8; --n-tip: #8FB6F0; --n-metin: #84CFA0; --n-sayi: #EBA96A;
  --n-yorum: #8B807C; --n-yerlesik: #6FC6D6; --n-fn: #EDE7E3; --n-op: #A29592;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--zemin); color: var(--metin);
  font-family: var(--govde); font-size: 14px;
  display: flex; flex-direction: column; overflow: hidden;
}
button, select {
  font-family: var(--govde); font-size: 13px; color: var(--metin);
  background: var(--yuzey); border: 1px solid var(--kenar);
  border-radius: 6px; padding: 5px 10px; cursor: pointer;
}
button:hover { border-color: var(--kenar-guclu); background: var(--yuzey-2); }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--vurgu); outline-offset: 1px; }
button:disabled { opacity: .5; cursor: default; }
button .ikon { width: 14px; height: 14px; vertical-align: -2px; margin-right: 5px; }
button kbd { font-family: var(--tek); font-size: 10px; opacity: .7; margin-left: 6px; }
.ara { flex: 1 1 auto; }

/* --- üst araç çubuğu ---------------------------------------------------- */
.ust {
  display: flex; align-items: center; gap: 6px;
  padding: 0 10px; height: 46px; flex: 0 0 auto;
  background: var(--yuzey); border-bottom: 1px solid var(--kenar);
}
.marka { display: flex; align-items: baseline; gap: 6px; margin-right: 8px;
  font-family: var(--tek); font-weight: 500; font-size: 15px; color: var(--vurgu); }
.marka span { font-size: 10px; font-weight: 400; color: var(--metin-soluk); }
.grup { display: flex; gap: 4px; padding: 0 8px; border-left: 1px solid var(--kenar); }
.grup:first-of-type { border-left: 0; }
button.birincil { background: var(--vurgu); border-color: var(--vurgu); color: var(--vurgu-metin); font-weight: 600; }
button.birincil:hover { filter: brightness(1.06); }

/* --- gövde: ağaç | düzenleyici | sağ panel ---------------------------- */
.govde {
  flex: 1 1 auto; min-height: 0;
  display: grid;
  grid-template-columns: var(--agac-genislik) minmax(0, 1.35fr) minmax(0, 1fr);
}
body.agac-kapali .govde { grid-template-columns: 0 minmax(0, 1.35fr) minmax(0, 1fr); }
body.agac-kapali .kenar-cubugu { display: none; }
.sutun { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.sutun + .sutun { border-left: 1px solid var(--kenar); }
.sutun-baslik {
  flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
  padding: 0 12px; height: 32px;
  font-family: var(--tek); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--metin-soluk); background: var(--zemin); border-bottom: 1px solid var(--kenar);
}
.rozet {
  font-family: var(--tek); text-transform: none; letter-spacing: 0; font-size: 11px;
  padding: 1px 7px; border-radius: 999px; border: 1px solid var(--kenar);
}
.rozet.iyi { color: var(--iyi); background: var(--iyi-zemin); }
.rozet.kotu { color: var(--hata); background: var(--hata-zemin); }
.rozet.uyari { color: var(--uyari); background: var(--uyari-zemin); }

/* --- dosya ağacı ---------------------------------------------------------- */
.kenar-cubugu { background: var(--yuzey); }
.agac { flex: 2 1 0; min-height: 0; overflow: auto; padding: 6px 6px 12px; font-size: 13px; }
.agac details { margin-bottom: 4px; }
.agac summary {
  list-style: none; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 6px;
  padding: 4px 8px; border-radius: 6px;
  font-family: var(--tek); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--metin-soluk);
}
.agac summary::-webkit-details-marker { display: none; }
.agac summary .ok { display: inline-block; width: 8px; transition: transform .15s; }
.agac details[open] summary .ok { transform: rotate(90deg); }
.agac summary .adet { margin-left: auto; opacity: .7; }
.agac ul { list-style: none; margin: 0; padding: 0 0 0 10px; }
.agac .dosya {
  display: flex; align-items: center; gap: 7px; width: 100%; text-align: left;
  padding: 4px 8px; border: 1px solid transparent; border-radius: 6px;
  background: none; font-size: 13px; color: var(--metin);
}
.agac .dosya .ikon { width: 13px; height: 13px; color: var(--metin-soluk); flex: none; }
.agac .dosya:hover { background: var(--yuzey-2); }
.agac .dosya.secili { background: var(--vurgu-zemin); color: var(--vurgu); border-color: var(--kenar); }
.agac .dosya.secili .ikon { color: var(--vurgu); }
.agac .dosya .nokta { margin-left: auto; color: var(--uyari); }

/* --- düzenleyici --------------------------------------------------------- */
.duzenleyici { flex: 1 1 auto; display: flex; min-height: 0; background: var(--kod-zemin); position: relative; overflow: hidden; }
.satirlar {
  flex: 0 0 auto; padding: 12px 8px 12px 12px; text-align: right;
  font-family: var(--tek); font-size: var(--kod-boy); line-height: var(--kod-satir);
  color: var(--oluk); background: var(--kod-zemin); border-right: 1px solid var(--kenar);
  user-select: none; overflow: hidden; white-space: pre; min-width: 44px;
}
.satirlar b { color: var(--hata); font-weight: 600; position: relative; }
.satirlar b::before { content: ''; position: absolute; left: -9px; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--hata); }
.satirlar i { color: var(--uyari); font-style: normal; font-weight: 600; position: relative; }
.satirlar i::before { content: ''; position: absolute; left: -9px; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--uyari); }
.alan { position: relative; flex: 1 1 auto; min-width: 0; overflow: hidden; }
.boya, .altcizgi, .alan textarea {
  margin: 0; padding: 12px 16px; border: 0;
  font-family: var(--tek); font-size: var(--kod-boy); line-height: var(--kod-satir);
  white-space: pre; overflow-wrap: normal; tab-size: 2;
  position: absolute; inset: 0; overflow: auto;
}
/* Tarayıcının kendi kuralı <code>'a `font-family: monospace` verir ve
   pre'den devralınan fontu ezer; boyalı metin başka fontla çizilince
   imleç sütun ilerledikçe kayar. Üç katman aynı ölçülerle yazılmalı:
   aynı font, aynı boy, ligatürsüz. */
.boya code, .altcizgi code { font: inherit; letter-spacing: inherit; }
.boya, .altcizgi, .alan textarea, .satirlar {
  font-variant-ligatures: none; font-feature-settings: 'liga' 0, 'calt' 0;
  font-kerning: none;
}
.boya { pointer-events: none; color: var(--metin); background: transparent; }
/* Hata altı çizgisi ayrı bir katmanda: boyalı metnin ortasına sütun
   hesabıyla etiket sokmak yerine aynı ölçülerde ikinci bir katman. */
.altcizgi { pointer-events: none; color: transparent; }
.altcizgi .dalgali {
  background: color-mix(in srgb, var(--hata) 14%, transparent);
  box-shadow: inset 0 -2px 0 var(--hata);
  border-radius: 2px;
}
.altcizgi .dalgali.uyari {
  background: color-mix(in srgb, var(--uyari) 14%, transparent);
  box-shadow: inset 0 -2px 0 var(--uyari);
}
.alan textarea { resize: none; color: transparent; background: transparent; caret-color: var(--vurgu); outline: none; }
/* Hata baloncuğu: fare hatalı aralığın üstünde durunca. */
.ipucu {
  position: absolute; z-index: 6; max-width: 440px; display: none;
  background: var(--yuzey); border: 1px solid var(--kenar); border-radius: 8px;
  box-shadow: 0 8px 24px -12px rgba(0,0,0,.45); padding: 8px 10px; font-size: 13px;
  border-left: 3px solid var(--hata);
}
.ipucu.acik { display: block; }
.ipucu.uyari { border-left-color: var(--uyari); }
.ipucu-baslik { font-family: var(--tek); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--hata); margin-bottom: 2px; }
.ipucu.uyari .ipucu-baslik { color: var(--uyari); }
.ipucu-mesaj { color: var(--metin); }
.ipucu-oneri { color: var(--metin-soluk); font-size: 12.5px; margin-top: 3px; }
.ipucu-oneri b { color: var(--iyi); font-weight: 600; }
.eylemler { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.duzelt {
  height: 24px; padding: 0 9px; font-size: 12px; border-radius: 5px;
  background: var(--vurgu-zemin); border: 1px solid var(--kenar); color: var(--vurgu);
}
.duzelt:hover { border-color: var(--vurgu); }
.duzelt .ikon { width: 12px; height: 12px; margin-right: 4px; vertical-align: -2px; }
/* Kod önerisi kutusu: imlecin altında, Tab ile uygulanır. */
/* Komut paleti: Ctrl+K. Dosya, sembol ve komut aynı listede aranır —
   ayrı ayrı pencereler açmak yerine tek giriş noktası. */
.palet-perde {
  position: fixed; inset: 0; z-index: 40; background: rgba(20,14,13,.34);
  align-items: flex-start; justify-content: center; padding-top: 12vh;
}
.palet-perde { display: none; }
.palet-perde.acik { display: flex; }
.palet {
  width: min(560px, 92vw); max-height: 64vh; display: flex;
  flex-direction: column; background: var(--yuzey);
  border: 1px solid var(--kenar); border-radius: 12px;
  box-shadow: 0 24px 60px -20px rgba(0,0,0,.5); overflow: hidden;
}
.palet input {
  font: inherit; font-size: 14px; padding: 12px 14px; border: none;
  border-bottom: 1px solid var(--kenar); background: transparent;
  color: var(--metin); outline: none;
}
.palet-liste { overflow-y: auto; padding: 5px; }
.palet-satir {
  display: flex; align-items: center; gap: 9px; padding: 7px 9px;
  border-radius: 6px; cursor: pointer; font-size: 13px;
}
.palet-satir.secili, .palet-satir:hover { background: var(--vurgu-zemin); }
.palet-satir .ad { color: var(--metin); }
.palet-satir .ad b { color: var(--vurgu); font-weight: 600; }
.palet-satir .yan {
  margin-left: auto; font-size: 11px; color: var(--metin-soluk);
  font-family: var(--tek); white-space: nowrap;
}
.palet-satir .tur {
  font-family: var(--tek); font-size: 10px; letter-spacing: .06em;
  text-transform: uppercase; color: var(--metin-soluk);
  border: 1px solid var(--kenar); border-radius: 4px; padding: 0 4px;
  flex: none;
}
.palet-bos { padding: 14px; color: var(--metin-soluk); font-size: 13px; }
.palet-alt {
  border-top: 1px solid var(--kenar); padding: 5px 10px; font-size: 11px;
  color: var(--metin-soluk); display: flex; gap: 12px; flex-wrap: wrap;
}
.palet-alt kbd {
  font-family: var(--tek); border: 1px solid var(--kenar);
  border-radius: 4px; padding: 0 4px;
}

/* Ara ve değiştir: düzenleyicinin üstünde ince bir şerit. */
.bul {
  display: none; align-items: center; gap: 6px; padding: 6px 10px;
  border-bottom: 1px solid var(--kenar); background: var(--panel);
  flex-wrap: wrap;
}
.bul.acik { display: flex; }
.bul input {
  font: inherit; font-family: var(--tek); font-size: 12px; padding: 4px 7px;
  border: 1px solid var(--kenar-guclu); border-radius: 6px;
  background: var(--yuzey); color: var(--metin); outline: none; width: 170px;
}
.bul input:focus { border-color: var(--vurgu); }
.bul button {
  font: inherit; font-size: 12px; padding: 4px 8px; cursor: pointer;
  border: 1px solid var(--kenar-guclu); border-radius: 6px;
  background: var(--yuzey); color: var(--metin);
}
.bul button:hover { background: var(--yuzey-2); }
.bul .sayac {
  font-family: var(--tek); font-size: 11px; color: var(--metin-soluk);
  min-width: 62px;
}
.bul .bosluk { flex: 1; }

/* Anahat: dosyadaki tanımlar. Ağacın altında, kendi başlığıyla. */
.anahat { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 4px 6px 10px; }
.anahat-satir {
  display: flex; align-items: center; gap: 7px; padding: 3px 7px;
  border-radius: 5px; cursor: pointer; font-size: 12px;
  font-family: var(--tek); color: var(--metin); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.anahat-satir:hover { background: var(--vurgu-zemin); }
.anahat-satir .tur {
  font-size: 10px; letter-spacing: .04em; color: var(--metin-soluk);
  flex: none;
}
.anahat-satir .no { margin-left: auto; font-size: 10px; color: var(--oluk); }
.anahat-bos { padding: 6px 10px; font-size: 12px; color: var(--metin-soluk); }

.oneri {
  position: absolute; z-index: 5; min-width: 220px; max-width: 360px;
  background: var(--yuzey); border: 1px solid var(--kenar); border-radius: 8px;
  box-shadow: 0 8px 24px -12px rgba(0,0,0,.45); padding: 4px; display: none;
  font-size: 13px;
}
.oneri.acik { display: block; }
.oneri-satir { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 5px; cursor: pointer; }
.oneri-satir.secili, .oneri-satir:hover { background: var(--vurgu-zemin); }
.oneri-satir .ad { font-family: var(--tek); color: var(--metin); }
.oneri-satir .ad b { color: var(--vurgu); font-weight: 600; }
.oneri-satir .tur { margin-left: auto; font-family: var(--tek); font-size: 10px; letter-spacing: .06em;
  text-transform: uppercase; color: var(--metin-soluk); }
.oneri-ipucu { padding: 3px 8px 2px; font-size: 11px; color: var(--metin-soluk); border-top: 1px solid var(--kenar); margin-top: 3px; }
.oneri-ipucu kbd { font-family: var(--tek); border: 1px solid var(--kenar); border-radius: 4px; padding: 0 4px; }
.alan textarea::selection { background: color-mix(in srgb, var(--vurgu) 24%, transparent); }
.n-kw { color: var(--n-kw); } .n-tip { color: var(--n-tip); } .n-metin { color: var(--n-metin); }
.n-sayi { color: var(--n-sayi); } .n-yorum { color: var(--n-yorum); font-style: italic; }
.n-yerlesik { color: var(--n-yerlesik); } .n-fn { color: var(--n-fn); } .n-op { color: var(--n-op); }

/* --- sağ panel: sekmeler ------------------------------------------------- */
.sekmeler { display: flex; gap: 2px; }
.sekme {
  height: 24px; padding: 0 9px; font: inherit; font-size: 12px;
  text-transform: none; letter-spacing: 0;
  color: var(--metin-soluk); background: none; border: 1px solid transparent; border-radius: 6px;
}
.sekme:hover { color: var(--metin); background: var(--yuzey-2); }
.sekme[aria-selected="true"] { color: var(--vurgu); background: var(--vurgu-zemin); border-color: var(--kenar); }
.sekme .sayi {
  font-family: var(--tek); font-size: 10px; margin-left: 5px; padding: 0 5px;
  border-radius: 999px; background: var(--hata); color: #fff;
}
.sekme .sayi.uyari { background: var(--uyari); color: #1a1200; }
.sekme .sayi:empty { display: none; }
.pano { flex: 1 1 auto; min-height: 0; position: relative; }
.pano > * { position: absolute; inset: 0; overflow: auto; }
.pano > [hidden] { display: none; }
/* Program sayfayla konuşuyorsa çizdiği şey burada görünür. */
#ekran { width: 100%; height: 100%; border: 0; background: var(--yuzey); }

.cikti-govde {
  padding: 12px 16px; margin: 0; background: var(--panel);
  font-family: var(--tek); font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
}
.cikti-govde .bos { font-family: var(--govde); color: var(--metin-soluk); font-style: italic; }
.cikti-govde .hata-blok {
  color: var(--hata); background: var(--hata-zemin); border-left: 3px solid var(--hata);
  padding: 10px 12px; margin: 0 0 10px; border-radius: 0 6px 6px 0; cursor: pointer;
}
.cikti-govde .uyari-blok {
  color: var(--uyari); background: var(--uyari-zemin); border-left: 3px solid var(--uyari);
  padding: 10px 12px; margin: 0 0 10px; border-radius: 0 6px 6px 0;
}

/* Sorunlar: her hata bir kart; satıra tıklayınca gidilir. */
.sorunlar { padding: 10px 12px; background: var(--panel); }
.sorunlar .bos { color: var(--metin-soluk); font-style: italic; }
.sorun {
  display: grid; grid-template-columns: auto 1fr; gap: 2px 10px;
  padding: 9px 11px; margin-bottom: 8px;
  background: var(--yuzey); border: 1px solid var(--kenar); border-left: 3px solid var(--hata);
  border-radius: 0 8px 8px 0; cursor: pointer;
}
.sorun:hover { border-color: var(--kenar-guclu); border-left-color: var(--hata); }
.sorun.uyari { border-left-color: var(--uyari); }
.sorun.uyari:hover { border-left-color: var(--uyari); }
.sorun.uyari .yer { color: var(--uyari); }
.sorun.uyari .kaynak mark { background: color-mix(in srgb, var(--uyari) 18%, transparent); box-shadow: inset 0 -2px 0 var(--uyari); }
.sorun .yer { grid-row: 1 / span 3; font-family: var(--tek); font-size: 11px; color: var(--hata);
  font-variant-numeric: tabular-nums; padding-top: 2px; }
.sorun .mesaj { font-size: 13.5px; }
.sorun .ipucu { font-size: 12.5px; color: var(--metin-soluk); }
.sorun .ipucu b { color: var(--iyi); font-weight: 600; }
.sorun .kaynak { margin-top: 4px; font-family: var(--tek); font-size: 12px; white-space: pre; overflow-x: auto;
  color: var(--metin-soluk); }
.sorun .kaynak mark { background: color-mix(in srgb, var(--hata) 18%, transparent); color: var(--metin);
  box-shadow: inset 0 -2px 0 var(--hata); }

/* --- alt çubuk ------------------------------------------------------------ */
.alt {
  flex: 0 0 auto; display: flex; align-items: center; gap: 14px; height: 28px;
  padding: 0 12px; background: var(--yuzey); border-top: 1px solid var(--kenar);
  font-family: var(--tek); font-size: 11.5px; color: var(--metin-soluk);
}
.alt .durum { display: flex; align-items: center; gap: 6px; }
.alt .nokta { width: 7px; height: 7px; border-radius: 50%; background: var(--iyi); }
.alt .nokta.kotu { background: var(--hata); }
.alt .tiklanir { cursor: pointer; color: var(--hata); }
.alt .tiklanir:hover { text-decoration: underline; }

@media (max-width: 900px) {
  .govde { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1.4fr 1fr; }
  .kenar-cubugu { max-height: 160px; }
  .sutun + .sutun { border-left: 0; border-top: 1px solid var(--kenar); }
  .ust { flex-wrap: wrap; height: auto; padding: 6px 8px; }
}
</style>
</head>
<body>

<header class="ust">
  <a class="marka" href="../" style="text-decoration:none" title="Rehbere dön">Nar<span id="surum">deneme</span></a>
  <div class="grup">

<script>
(function () {
  'use strict';

  // --- gömülü veri ----------------------------------------------------
  var DOSYALAR = {"ornekler/baslangic.nar": "// Nar'a hoş geldin. Değiştir ve Çalıştır'a bas (Ctrl+Enter).\n// Yazarken kod önerisi çıkar; Tab ile uygula.\n\nstruct Kisi {\n  ad: String\n  yas: Int\n}\n\nfn selamla(k: Kisi) -> String =\n  \"Merhaba ${k.ad}, ${k.yas} yaşındasın.\"\n\nfn main() {\n  let kisiler = [\n    Kisi { ad: \"Ayşe\", yas: 30 },\n    Kisi { ad: \"Mehmet\", yas: 17 },\n    Kisi { ad: \"Zeynep\", yas: 24 }\n  ]\n\n  for k in kisiler {\n    print(selamla(k))\n  }\n\n  let yetiskinler = kisiler.filter(|k| k.yas >= 18)\n  print(\"yetişkin sayısı:\", yetiskinler.len())\n}\n", "ornekler/tip-guvenligi.nar": "// Nar tipleri derleme anında denetler.\n// Aşağıdaki satırın yorumunu kaldır, hatayı Türkçe gör.\n\nfn main() {\n  let yas: Int = 30\n  // let ad: String = yas\n\n  print(\"yaş:\", yas)\n}\n", "ornekler/match-enum.nar": "enum Sekil {\n  Daire(Float)\n  Dikdortgen(Float, Float)\n  Kare(Float)\n}\n\nfn alan(s: Sekil) -> Float = match s {\n  Daire(r) -> 3.14159 * r * r\n  Dikdortgen(en, boy) -> en * boy\n  Kare(k) -> k * k\n}\n\nfn main() {\n  let sekiller = [Daire(2.0), Dikdortgen(3.0, 4.0), Kare(5.0)]\n  for s in sekiller {\n    print(alan(s))\n  }\n}\n", "ornekler/arayuz.nar": "// Bu örnek ekrana çizer: sağdaki \"Ekran\" sekmesine bak.\n\nfn main() {\n  if let alan = bul(\"#uygulama\") {\n    var sayac = 0\n\n    let baslik = olustur(\"h2\")\n    baslik.metinYaz(\"Sayaç\")\n\n    let deger = olustur(\"p\")\n    deger.metinYaz(\"0\")\n\n    let dugme = olustur(\"button\")\n    dugme.metinYaz(\"Artır\")\n    dugme.dinle(\"click\", |o| {\n      sayac += 1\n      deger.metinYaz(\"${sayac}\")\n    })\n\n    alan.ekle(baslik)\n    alan.ekle(deger)\n    alan.ekle(dugme)\n  } else {\n    print(\"Bu program bir sayfada çalışmalı.\")\n  }\n}\n", "rehber/baslangic/ilk-program.nar": "fn main() {\n  print(\"Merhaba dünya!\")\n}", "rehber/baslangic/yorumlar.nar": "fn main() {\n  // Bu satır bir yorum, çalıştırılmaz.\n\n  /* Birden çok satırı\n     kaplayan yorum da yazılabilir. */\n\n  print(\"yorumlar çıktıyı etkilemez\")\n}\n", "rehber/baslangic/yazdirma.nar": "fn main() {\n  print(\"tek değer\")\n  print(\"ad:\", \"Ayşe\", \"yaş:\", 30)\n  print([1, 2, 3])\n  print(3.5, true, none)\n}\n", "rehber/degiskenler/let-var.nar": "fn main() {\n  let ad = \"Mustafa\"      // değişmez\n  var sayac = 0           // değişebilir\n\n  sayac = sayac + 1\n  sayac += 5              // aynı şeyin kısa yazımı\n\n  print(ad, sayac)\n}\n", "rehber/degiskenler/tipler.nar": "fn main() {\n  let a = 42              // Int  (kendisi anladı)\n  let b = 3.14            // Float\n  let c = \"merhaba\"       // String\n  let d = true            // Bool\n\n  let e: Float = 10       // istersen açıkça yaz\n  let f: String = \"elma\"\n\n  print(a, b, c, d, e, f)\n}\n", "rehber/degiskenler/sayilar.nar": "fn main() {\n  print(2 + 3)            // 5\n  print(10 - 4)           // 6\n  print(3 * 4)            // 12\n  print(7 / 2)            // 3    <- tam bölme\n  print(7 / 2.0)          // 3.5  <- ondalıklı\n  print(7 % 3)            // 1    <- kalan\n  print(1 + 2.5)          // 3.5  <- karışık kullanılabilir\n\n  print(sqrt(16), abs(-5), min(3, 8), max(3, 8))\n  print(floor(3.7), ceil(3.2), round(3.5))\n}\n", "rehber/degiskenler/metinler.nar": "fn main() {\n  let ad = \"Ayşe\"\n  let yas = 30\n\n  print(\"Merhaba \" + ad)\n  print(\"Yaş: \" + yas)              // sayı otomatik yazıya döner\n  print(\"${ad} ${yas} yaşında\")     // gömme — en okunaklısı\n  print(\"Toplam: ${yas + 5}\")       // içinde işlem de yapılır\n}\n", "rehber/degiskenler/metin-metotlari.nar": "fn main() {\n  let s = \"  Merhaba Dünya  \"\n\n  print(s.trim())                  // baştaki/sondaki boşlukları atar\n  print(s.trim().len())            // harf sayısı\n  print(s.trim().lower())\n  print(\"istanbul\".upperTr())      // Türkçe: İSTANBUL\n  print(\"IĞDIR\".lowerTr())         // Türkçe: ığdır\n  print(\"a-b-c\".split(\"-\"))\n  print(\"a-b-c\".replace(\"-\", \"+\"))\n  print(\"merhaba\".contains(\"hab\"))\n  print(\"merhaba\".slice(0, 3))     // ilk 3 harf\n  print(\"ab\".repeat(3))\n}\n", "rehber/degiskenler/karakter-kodu.nar": "fn main() {\n  print(\"A\".kodu())          // 65\n  print(\"a\".kodu())          // 97\n  print(koddan(65))          // A\n\n  // Türkçe harfler de aynı şekilde\n  print(\"ı\".kodu())\n  print(koddan(305))\n\n  // Sezar şifresi: her harfi üç ileri kaydır\n  let harf = \"d\"\n  print(koddan(harf.kodu() + 3))\n}\n", "rehber/degiskenler/bool.nar": "fn main() {\n  print(5 > 3)             // true\n  print(5 == 5)            // eşit mi\n  print(5 != 3)            // eşit değil mi\n  print(5 >= 5, 2 <= 1)\n\n  let a = true\n  let b = false\n  print(a && b)            // ve   — ikisi de doğruysa\n  print(a || b)            // veya — biri doğruysa\n  print(!a)                // değil\n}\n", "rehber/kararlar/if.nar": "fn main() {\n  let not = 85\n\n  if not >= 90 {\n    print(\"A aldın\")\n  } else if not >= 80 {\n    print(\"B aldın\")\n  } else {\n    print(\"Daha çok çalış\")\n  }\n}\n", "rehber/kararlar/if-ifade.nar": "fn main() {\n  let yas = 20\n\n  let durum = if yas >= 18 { \"yetişkin\" } else { \"çocuk\" }\n  print(durum)\n\n  // zincirlenebilir\n  let not = 85\n  let harf = if not >= 90 { \"A\" } else if not >= 80 { \"B\" } else { \"C\" }\n  print(\"harf:\", harf)\n\n  // başka bir ifadenin içinde de kullanılabilir\n  print(\"ücret: \" + if yas < 12 { 0 } else { 50 })\n}\n", "rehber/kararlar/blok-ifadesi.nar": "enum Hava {\n  Gunesli\n  Yagmurlu\n  Karli\n}\n\nfn oneri(h: Hava) -> String = match h {\n  Gunesli -> \"şapka al\"\n  Yagmurlu -> {\n    let arac = \"şemsiye\"\n    let sebep = \"yağmur\"\n    \"${arac} al (${sebep})\"\n  }\n  Karli -> {\n    let katman = 3\n    \"${katman} kat giy\"\n  }\n}\n\nfn sinif(not: Int) -> String = if not >= 90 {\n  \"A\"\n} else if not >= 80 {\n  let fark = 90 - not\n  \"B (A'ya ${fark} puan)\"\n} else {\n  \"C\"\n}\n\nfn main() {\n  print(oneri(Yagmurlu))\n  print(oneri(Karli))\n  print(sinif(85))\n}", "rehber/donguler/for.nar": "fn main() {\n  for i in 1..4 {\n    print(\"sayı\", i)\n  }\n\n  for i in 1..=3 {\n    print(\"dahil\", i)\n  }\n\n  for meyve in [\"elma\", \"armut\", \"kiraz\"] {\n    print(meyve)\n  }\n\n  for harf in \"abc\" {\n    print(harf)\n  }\n}\n", "rehber/donguler/indeksli-for.nar": "fn main() {\n  let sehirler = [\"İstanbul\", \"Ankara\", \"İzmir\"]\n  for (sira, sehir) in sehirler {\n    print(\"${sira + 1}. ${sehir}\")\n  }\n\n  for (i, harf) in \"açık\" {\n    print(i, harf)\n  }\n\n  let yaslar = {\"Ayşe\": 30, \"Mehmet\": 24}\n  for (ad, yas) in yaslar {\n    print(ad, yas)\n  }\n}\n", "rehber/donguler/while.nar": "fn main() {\n  var sayi = 1\n\n  while sayi < 100 {\n    sayi = sayi * 2\n  }\n\n  print(\"100'ü aşan ilk ikinin kuvveti:\", sayi)\n}\n", "rehber/donguler/break-continue.nar": "fn main() {\n  for i in 1..=10 {\n    if i % 2 == 0 {\n      continue          // çiftleri atla\n    }\n    if i > 7 {\n      break             // 7'yi geçince dur\n    }\n    print(i)\n  }\n}\n", "rehber/listeler/liste.nar": "fn main() {\n  var sayilar = [5, 3, 8, 1]\n\n  print(sayilar)\n  print(\"ilk eleman:\", sayilar[0])\n  print(\"kaç eleman:\", sayilar.len())\n\n  sayilar.push(10)              // sona ekle\n  print(sayilar)\n\n  print(\"sıralı:\", sayilar.sort())\n  print(\"ters:\", sayilar.reverse())\n  print(\"içinde 8 var mı:\", sayilar.contains(8))\n  print(\"bir kısmı:\", sayilar.slice(1, 3))\n}\n", "rehber/listeler/liste-kolay.nar": "fn main() {\n  let sayilar = [5, 3, 8, 1, 3]\n\n  print(\"toplam:\", sayilar.toplam())\n  print(\"ortalama:\", sayilar.ortalama())\n  print(\"çarpım:\", sayilar.carpim())\n  print(\"en büyük:\", sayilar.enBuyuk() ?? 0)\n  print(\"en küçük:\", sayilar.enKucuk() ?? 0)\n\n  print(\"iki katları:\", sayilar.kat(2))\n  print(\"10 artırılmış:\", sayilar.artir(10))\n  print(\"3'ten büyükler:\", sayilar.buyukler(3))\n  print(\"3'ten küçükler:\", sayilar.kucukler(3))\n  print(\"çiftler:\", sayilar.ciftler())\n  print(\"tekler:\", sayilar.tekler())\n\n  print(\"benzersiz:\", sayilar.benzersiz())\n  print(\"kaç tane 3 var:\", sayilar.say(3))\n\n  let kelimeler = [\"nar\", \"elma\", \"kiraz\"]\n  print(\"büyük harf:\", kelimeler.buyukHarf())\n  print(\"'a' içerenler:\", kelimeler.icerenler(\"a\"))\n}\n", "rehber/listeler/liste-donusum.nar": "fn main() {\n  let sayilar = [1, 2, 3, 4, 5]\n\n  print(sayilar.map(|x| x * x))          // her birinin karesi\n  print(sayilar.filter(|x| x % 2 == 0))  // sadece çiftler\n  print(sayilar.reduce(|a, b| a + b, 0)) // toplamı\n\n  // zincirlenebilir\n  print(sayilar.filter(|x| x > 2).map(|x| x * 10))\n\n  let kelimeler = [\"nar\", \"elma\", \"kiraz\"]\n  print(kelimeler.map(|k| k.upperTr()).join(\", \"))\n}\n", "rehber/listeler/sozluk.nar": "fn main() {\n  var stok = {\"elma\": 12, \"armut\": 3}\n\n  stok.set(\"kiraz\", 7)\n\n  print(stok)\n  print(\"kaç çeşit:\", stok.len())\n  print(\"elma:\", stok.get(\"elma\") ?? 0)\n  print(\"muz:\", stok.get(\"muz\") ?? 0)      // yok -> 0\n  print(\"armut var mı:\", stok.has(\"armut\"))\n\n  for (urun, adet) in stok {\n    print(\"${urun}: ${adet} adet\")\n  }\n}\n", "rehber/fonksiyonlar/fonksiyon.nar": "fn selamla(ad: String) {\n  print(\"Merhaba \" + ad)\n}\n\nfn topla(a: Int, b: Int) -> Int {\n  return a + b\n}\n\nfn main() {\n  selamla(\"Nar\")\n  print(topla(3, 4))\n}", "rehber/fonksiyonlar/kisa-fonksiyon.nar": "fn kare(x: Int) -> Int = x * x\n\nfn selam(ad: String) -> String = \"Merhaba \" + ad\n\nfn buyuk_mu(n: Int) -> Bool = n > 100\n\nfn main() {\n  print(kare(9))\n  print(selam(\"Nar\"))\n  print(buyuk_mu(150))\n}", "rehber/fonksiyonlar/ozyineleme.nar": "fn faktoriyel(n: Int) -> Int {\n  if n <= 1 {\n    return 1\n  }\n  return n * faktoriyel(n - 1)\n}\n\nfn fib(n: Int) -> Int = if n < 2 { n } else { fib(n - 1) + fib(n - 2) }\n\nfn main() {\n  print(\"6! =\", faktoriyel(6))\n  print(\"fib(20) =\", fib(20))\n}", "rehber/fonksiyonlar/lambda.nar": "fn main() {\n  let iki_kat = |x: Int| x * 2\n  print(iki_kat(21))\n\n  // birden çok satır gerekiyorsa\n  let mesafe = |a: Int, b: Int| {\n    let fark = a - b\n    return abs(fark)\n  }\n  print(mesafe(3, 10))\n\n  // bir listeye uygularken tip yazmaya gerek yok\n  print([1, 2, 3].map(|x| x + 100))\n}\n", "rehber/tipler/struct.nar": "struct Kisi {\n  ad: String\n  var yas: Int\n}\n\nfn main() {\n  let k = Kisi { ad: \"Ayşe\", yas: 30 }\n  print(k)\n  print(k.ad, \"->\", k.yas)\n  k.yas = 31\n  print(\"doğum günü sonrası:\", k.yas)\n}", "rehber/tipler/metot.nar": "struct Dikdortgen {\n  en: Float\n  boy: Float\n\n  fn alan() -> Float = self.en * self.boy\n  fn cevre() -> Float = 2.0 * (self.en + self.boy)\n  fn kare_mi() -> Bool = self.en == self.boy\n\n  fn buyut(kat: Float) -> Dikdortgen {\n    return Dikdortgen { en: self.en * kat, boy: self.boy * kat }\n  }\n}\n\nfn main() {\n  let d = Dikdortgen { en: 3.0, boy: 4.0 }\n  print(\"alan:\", d.alan())\n  print(\"çevre:\", d.cevre())\n  print(\"kare mi:\", d.kare_mi())\n  print(\"iki katı:\", d.buyut(2.0))\n}", "rehber/tipler/enum.nar": "enum Hava {\n  Gunesli\n  Yagmurlu\n  Karli\n}\n\nfn main() {\n  let bugun = Hava.Yagmurlu\n  print(bugun)\n}", "rehber/tipler/kisa-varyant.nar": "enum Hava {\n  Gunesli\n  Yagmurlu\n  Karli\n}\n\nfn oneri(h: Hava) -> String = match h {\n  Gunesli -> \"şapka al\"\n  Yagmurlu -> \"şemsiye al\"\n  Karli -> \"atkı al\"\n}\n\nfn main() {\n  print(oneri(Yagmurlu))\n  print(oneri(Hava.Karli))\n}", "rehber/tipler/tuple.nar": "fn bolVeKalan(a: Int, b: Int) -> (Int, Int) = (a / b, a % b)\n\nfn enUzunKelime(cumle: String) -> (String, Int) {\n  var enUzun = \"\"\n  for k in cumle.split(\" \") {\n    if k.len() > enUzun.len() {\n      enUzun = k\n    }\n  }\n  return (enUzun, enUzun.len())\n}\n\nfn main() {\n  let (bolum, kalan) = bolVeKalan(17, 5)\n  print(str(bolum) + \" kalan \" + str(kalan))\n\n  let (kelime, uzunluk) = enUzunKelime(\"bugün hava çok güzel\")\n  print(kelime + \" — \" + str(uzunluk) + \" harf\")\n\n  // Tek tek de okunur:\n  let ikili = bolVeKalan(9, 2)\n  print(str(ikili.0) + \"/\" + str(ikili.1))\n}", "rehber/tipler/kosullu-kol.nar": "fn siniflandir(n: Int) -> String = match n {\n  x if x < 0 -> \"eksi\"\n  0 -> \"sıfır\"\n  1..=9 -> \"tek haneli\"\n  10..=99 -> \"iki haneli\"\n  _ -> \"daha büyük\"\n}\n\nfn main() {\n  for n in [-3, 0, 7, 42, 1000] {\n    print(str(n) + \" -> \" + siniflandir(n))\n  }\n}", "rehber/tipler/varsayilan-arguman.nar": "struct Kutu {\n  var yazi: String\n  var genislik: Int = 20\n  var cerceve: Bool = true\n}\n\nfn bicim(metin: String, once: String = \"[\", sonra: String = \"]\") -> String =\n  once + metin + sonra\n\nfn main() {\n  print(bicim(\"selam\"))\n  print(bicim(\"selam\", sonra: \">\"))\n  print(bicim(sonra: \">\", once: \"<\", metin: \"selam\"))\n\n  let k = Kutu { yazi: \"not\" }\n  print(k.yazi + \" \" + str(k.genislik) + \" \" + str(k.cerceve))\n}", "rehber/tipler/match.nar": "enum Hava {\n  Gunesli\n  Yagmurlu\n  Karli\n}\n\nfn tavsiye(h: Hava) -> String = match h {\n  Hava.Gunesli -> \"Şapka al.\"\n  Hava.Yagmurlu -> \"Şemsiye al.\"\n  Hava.Karli -> \"Mont al.\"\n}\n\nfn main() {\n  for h in [Hava.Gunesli, Hava.Yagmurlu, Hava.Karli] {\n    print(tavsiye(h))\n  }\n  let n = 3\n  print(match n {\n    1 -> \"bir\"\n    2 -> \"iki\"\n    _ -> \"çok\"\n  })\n}", "rehber/tipler/enum-veri.nar": "enum Sonuc {\n  Tamam(Int)\n  Hata(String)\n}\n\nfn bol(a: Int, b: Int) -> Sonuc {\n  if b == 0 {\n    return Sonuc.Hata(\"sıfıra bölünemez\")\n  }\n  return Sonuc.Tamam(a / b)\n}\n\nfn main() {\n  for bolen in [4, 0, 5] {\n    match bol(100, bolen) {\n      Sonuc.Tamam(deger) -> print(\"100 / ${bolen} = ${deger}\")\n      Sonuc.Hata(mesaj) -> print(\"olmadı: ${mesaj}\")\n    }\n  }\n}", "rehber/generic/generic-giris.nar": "struct Kutu<T> {\n  deger: T\n  fn al() -> T = self.deger\n}\n\nfn main() {\n  let sayiKutusu = Kutu { deger: 5 }\n  let metinKutusu = Kutu { deger: \"merhaba\" }\n  print(sayiKutusu.al())\n  print(metinKutusu.al())\n  let acik = Kutu<Float> { deger: 2.5 }\n  print(acik.deger)\n}", "rehber/generic/generic-fonksiyon.nar": "fn ilk<T>(liste: [T]) -> T? {\n  if liste.len() == 0 {\n    return none\n  }\n  return liste[0]\n}\n\nfn ikiKat<T>(x: T) -> [T] = [x, x]\n\nfn main() {\n  print(ilk([3, 4, 5]) ?? 0)\n  print(ilk([\"a\", \"b\"]) ?? \"yok\")\n  let bos: [Int] = []\n  print(ilk(bos) ?? -1)\n  print(ikiKat(7))\n  print(ikiKat(\"x\"))\n}", "rehber/generic/sonuc-tipi.nar": "enum Sonuc<T, H> {\n  Tamam(T)\n  Hata(H)\n}\n\nfn bol(a: Int, b: Int) -> Sonuc<Int, String> {\n  if b == 0 {\n    return Sonuc.Hata(\"sıfıra bölünemez\")\n  }\n  return Sonuc.Tamam(a / b)\n}\n\nfn main() {\n  for bolen in [4, 0] {\n    match bol(100, bolen) {\n      Sonuc.Tamam(deger) -> print(\"100 / ${bolen} = ${deger}\")\n      Sonuc.Hata(mesaj) -> print(\"olmadı: ${mesaj}\")\n    }\n  }\n}", "rehber/generic/generic-ozyineli.nar": "enum Agac<T> {\n  Yaprak(T)\n  Dal([Agac<T>])\n}\n\nfn topla(a: Agac<Int>) -> Int = match a {\n  Agac.Yaprak(n) -> n\n  Agac.Dal(dallar) -> dallar.map(|d| topla(d)).toplam()\n}\n\nfn main() {\n  let agac = Agac.Dal([\n    Agac.Yaprak(1),\n    Agac.Dal([Agac.Yaprak(2), Agac.Yaprak(3)])\n  ])\n  print(\"yaprakların toplamı:\", topla(agac))\n}", "rehber/arayuz/arayuz-giris.nar": "interface Yazdirilabilir {\n  fn yaz() -> String\n}\n\nstruct Nokta: Yazdirilabilir {\n  x: Float\n  y: Float\n  fn yaz() -> String = \"(${self.x}, ${self.y})\"\n}\n\nstruct Kisi: Yazdirilabilir {\n  ad: String\n  fn yaz() -> String = \"kişi: \" + self.ad\n}\n\nfn goster(sey: Yazdirilabilir) {\n  print(sey.yaz())\n}\n\nfn main() {\n  goster(Nokta { x: 1.0, y: 2.0 })\n  goster(Kisi { ad: \"Ayşe\" })\n}", "rehber/arayuz/arayuz-liste.nar": "interface Yazdirilabilir {\n  fn yaz() -> String\n}\n\nstruct Kisi: Yazdirilabilir {\n  ad: String\n  fn yaz() -> String = \"kişi: \" + self.ad\n}\n\nenum Durum: Yazdirilabilir {\n  Acik\n  Kapali\n  fn yaz() -> String = match self {\n    Durum.Acik -> \"açık\"\n    Durum.Kapali -> \"kapalı\"\n  }\n}\n\nfn main() {\n  let hepsi: [Yazdirilabilir] = [\n    Kisi { ad: \"Ayşe\" },\n    Durum.Acik,\n    Durum.Kapali\n  ]\n  for e in hepsi {\n    print(\"- \" + e.yaz())\n  }\n}", "rehber/arayuz/arayuz-generic.nar": "interface Olculebilir {\n  fn olcu() -> Float\n}\n\nstruct Nokta: Olculebilir {\n  x: Float\n  y: Float\n  fn olcu() -> Float = sqrt(self.x * self.x + self.y * self.y)\n}\n\nfn enBuyuk<T: Olculebilir>(liste: [T]) -> Float {\n  var en = 0.0\n  for e in liste {\n    if e.olcu() > en {\n      en = e.olcu()\n    }\n  }\n  return en\n}\n\nfn main() {\n  print(enBuyuk([\n    Nokta { x: 3.0, y: 4.0 },\n    Nokta { x: 6.0, y: 8.0 }\n  ]))\n}", "rehber/opsiyonel/none.nar": "fn main() {\n  let takma: String? = none\n  let gercek: String? = \"Nar\"\n\n  print(takma)\n  print(gercek)\n\n  // ?? ile yedek değer ver\n  print(takma ?? \"takma adı yok\")\n  print(gercek ?? \"takma adı yok\")\n}\n", "rehber/opsiyonel/opsiyonel-kullanim.nar": "fn main() {\n  let sayilar = [10, 20, 30]\n\n  let ilk = sayilar.first()        // İlk eleman olmayabilir (liste boşsa)\n  print(\"ilk:\", ilk ?? 0)\n\n  if ilk != none {\n    print(\"var, iki katı:\", ilk * 2)   // burada artık kesin var\n  }\n\n  var bos: [Int] = []\n  print(\"boş listenin ilki:\", bos.first() ?? -1)\n}\n", "rehber/opsiyonel/if-let.nar": "fn yas(ad: String) -> Int? {\n  let defter = {\"Ayşe\": 30, \"Mehmet\": 24}\n  return defter.get(ad)\n}\n\nfn main() {\n  if let y = yas(\"Ayşe\") {\n    print(\"Ayşe ${y} yaşında\")\n  } else {\n    print(\"Ayşe defterde yok\")\n  }\n\n  if let y = yas(\"Zeynep\") {\n    print(\"Zeynep ${y} yaşında\")\n  } else if let y = yas(\"Mehmet\") {\n    print(\"Zeynep yok ama Mehmet ${y} yaşında\")\n  } else {\n    print(\"ikisi de yok\")\n  }\n}", "rehber/opsiyonel/soru-operatoru.nar": "// Satırların ilkindeki sayıyı okur.\n// Herhangi bir adım tutmazsa sonuç none olur.\nfn ilkSayi(satirlar: [String]) -> Int? {\n  let satir = satirlar.first()?\n  return int(satir.trim())?\n}\n\nfn main() {\n  print(ilkSayi([\"  42  \", \"başka satır\"]) ?? -1)\n  print(ilkSayi([\"sayı değil\"]) ?? -1)\n  print(ilkSayi([]) ?? -1)\n}", "rehber/opsiyonel/guvenli-zincir.nar": "struct Adres {\n  sehir: String\n}\n\nstruct Kisi {\n  ad: String\n  adres: Adres?\n}\n\nfn main() {\n  let a = Kisi { ad: \"Ayşe\", adres: Adres { sehir: \"Ankara\" } }\n  let b = Kisi { ad: \"Veli\", adres: none }\n  print(a.adres?.sehir ?? \"adres yok\")\n  print(b.adres?.sehir ?? \"adres yok\")\n}", "rehber/duzen/hata-mesajlari.nar": "fn main() {\n  let sayi = 5\n  sayi = 6\n}\n", "rehber/duzen/hata-eksik-dal.nar": "enum Durum {\n  Acik\n  Kapali\n  Bekliyor\n}\n\nfn main() {\n  match Durum.Acik {\n    Durum.Acik -> print(\"açık\")\n    Durum.Kapali -> print(\"kapalı\")\n  }\n}"};          // yol -> kaynak
